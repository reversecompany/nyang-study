<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>냥공부</title>
<meta name="description" content="고양이랑 매일 조금씩 공부하는 앱">
<meta name="theme-color" content="#fff3f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냥공부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff3f6; --card:#ffffff; --ink:#5a4650; --soft:#7d6870; --line:#5a4646;
  --pink:#ff8fab; --pink-d:#f06d92; --pink-l:#ffe0e9;
  --mint:#8fdcc2; --mint-l:#dcf6ec; --butter:#ffd98a; --butter-l:#fff2cf;
  --lav:#c9b6ff; --lav-l:#efe8ff; --sky:#9fd3f0;
  --fur:#fff4e6; --p1:#f6b26b; --p2:#f6b26b; --tail:#f6b26b;
  --r:22px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'Gaegu','Jua',system-ui,sans-serif;font-size:19px;overflow-x:hidden;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,input{font-family:inherit;color:inherit}
.jua{font-family:'Jua',system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 96px)}

/* ---------- 상단 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-family:'Jua';font-size:24px;color:var(--pink-d);letter-spacing:-.5px}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:99px;padding:5px 11px 5px 8px;
  font-family:'Jua';font-size:15px;box-shadow:0 2px 0 #f3d9e1}
.pill svg{width:18px;height:18px}

.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:0 3px 0 #f5dbe3}
.greet{font-family:'Jua';font-size:22px;margin:0 0 4px}
.line{font-size:21px;line-height:1.35;margin:0;min-height:1.35em}
.today{margin-top:8px;font-size:17px;color:var(--soft)}

/* ---------- 무대 (고양이가 걷는 곳) ---------- */
.stage{position:relative;height:210px;margin:12px -16px 4px;overflow:hidden}
.stage .wall{position:absolute;inset:0 0 46px 0}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:58px;
  background:repeating-linear-gradient(90deg,#ffe6ee 0 38px,#ffdbe6 38px 76px);border-top:3px solid #ffd0de}
.stage .rug{position:absolute;left:50%;bottom:10px;width:62%;height:26px;transform:translateX(-50%);
  border-radius:50%;background:#fff;opacity:.55}
.win{position:absolute;right:26px;top:14px;width:78px;height:64px;border-radius:14px;background:linear-gradient(#cfeafe,#eaf6ff);
  border:4px solid #fff;box-shadow:0 2px 0 #f3d4de}
.win:before,.win:after{content:"";position:absolute;background:#fff}
.win:before{left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%)}
.win:after{top:50%;left:0;right:0;height:4px;transform:translateY(-50%)}
.cloud{position:absolute;width:24px;height:9px;border-radius:9px;background:#fff;top:18px;left:8px;animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(60px)}}
.frame{position:absolute;left:26px;top:20px;width:44px;height:54px;background:#fff;border-radius:8px;box-shadow:0 2px 0 #f3d4de;
  display:grid;place-items:center;font-family:'Jua';font-size:11px;color:var(--pink-d);text-align:center;line-height:1.1}
.catwrap{position:absolute;bottom:14px;left:0;width:140px;height:112px;will-change:transform;cursor:pointer}
.catflip{width:100%;height:100%;transition:transform .18s}
.catwrap.hop .catflip{animation:hop .55s ease-out}
@keyframes hop{0%{transform:translateY(0) scaleX(var(--dir))}40%{transform:translateY(-26px) scaleX(var(--dir))}100%{transform:translateY(0) scaleX(var(--dir))}}
.bubble{position:absolute;bottom:136px;left:0;max-width:min(260px,calc(100vw - 40px));background:#fff;border-radius:16px;padding:8px 13px;
  font-size:18px;line-height:1.3;box-shadow:0 3px 0 #f1d3dd;transform:translateX(-50%);opacity:0;transition:opacity .3s;pointer-events:none;
  white-space:normal;width:max-content}
.bubble.on{opacity:1}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.zzz{position:absolute;font-family:'Jua';color:#b9a6e8;font-size:20px;pointer-events:none;animation:zz 2.6s ease-in infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(22px,-46px) scale(1.2)}}
.heart{position:absolute;color:var(--pink);font-size:22px;pointer-events:none;animation:heart 1.1s ease-out forwards}
@keyframes heart{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--hx),-70px) scale(1.3)}}

/* ---------- 고양이 SVG ---------- */
.cat{width:100%;height:100%;overflow:visible}
.cat .o{stroke:var(--line);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
.cat .fur{fill:var(--fur)} .cat .p1{fill:var(--p1)} .cat .p2{fill:var(--p2)}
.cat .leg{transform-box:fill-box;transform-origin:50% 12%}
.cat .tail{transform-box:fill-box;transform-origin:100% 100%;animation:tail 1.8s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.walking .leg.a{animation:legA .44s ease-in-out infinite alternate}
.walking .leg.b{animation:legB .44s ease-in-out infinite alternate}
.walking .bodyg{animation:bob .22s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
@keyframes legB{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.m-tired.walking .leg.a,.m-tired.walking .leg.b{animation-duration:.9s}
.m-tired.walking .bodyg{animation-duration:.45s}
.eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eyes-happy,.eyes-closed,.eyes-tired,.sweat{display:none}
.sleeppose{display:none}
.m-sleep:not(.awake) .walkpose,.m-rest:not(.awake) .walkpose,.resting .walkpose{display:none}
.m-sleep:not(.awake) .sleeppose,.m-rest:not(.awake) .sleeppose,.resting .sleeppose{display:inline}
.sleeppose .eyes-open{display:none} .sleeppose .eyes-closed{display:inline}
.m-tired .eyes-open{display:none} .m-tired .eyes-tired{display:inline} .m-tired .sleeppose .eyes-closed{display:none}
.m-tired .sweat{display:inline}
.head{transform-box:fill-box;transform-origin:50% 50%}
.m-tired .head{transform:translateY(5px) rotate(6deg)}
.pet .walkpose .eyes-open,.pet .walkpose .eyes-tired,.happyface .walkpose .eyes-open{display:none}
.pet .walkpose .eyes-happy,.happyface .walkpose .eyes-happy{display:inline}
.acc{display:none}
/* ---------- 사진 냥이 (스티커) ---------- */
.ph{display:none;position:absolute;left:50%;bottom:2px;width:112px;height:112px;margin-left:-56px;transform-origin:50% 100%}
.photo .ph{display:block} .photo .cat{display:none}
.pimg{width:100%;height:100%;border-radius:28px;border:5px solid #fff;background:#ffe9ef center/cover no-repeat;
  box-shadow:0 5px 0 #f1cfd9,0 10px 18px rgba(120,60,80,.13);transition:background-image .2s}
.photo.walking .ph{animation:wob .44s ease-in-out infinite alternate}
.photo.walking.m-tired .ph{animation-duration:.9s}
.photo.sleeping .ph{animation:breathe 3s ease-in-out infinite}
@keyframes wob{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-7px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035,1.02)}}
.pacc{position:absolute;display:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
.w-bow .pacc.bow{display:block;right:-14px;top:-14px;width:44px}
.w-flower .pacc.flower{display:block;left:-10px;top:-10px;width:30px}
.w-crown .pacc.crown{display:block;left:50%;top:-24px;width:40px;margin-left:-20px}
.w-bell .pacc.bell{display:block;left:50%;bottom:-12px;width:70px;margin-left:-35px}
.w-glasses .pacc.glasses{display:block;left:-14px;bottom:10px;width:46px;transform:rotate(-14deg)}
.mini .ph{display:block;position:relative;left:0;margin:0 auto;bottom:0}
.looks{display:flex;gap:10px;margin-bottom:18px}
.w-bow .acc-bow,.w-bell .acc-bell,.w-flower .acc-flower,.w-glasses .acc-glasses,.w-crown .acc-crown{display:inline}

/* ---------- 버튼 ---------- */
.btn{display:block;width:100%;border:0;border-radius:20px;padding:15px 12px;font-family:'Jua';font-size:22px;cursor:pointer;
  background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.btn.sub{font-size:18px;padding:12px 8px;color:var(--ink)}
.btn.butter{background:var(--butter);box-shadow:0 5px 0 #eebd57}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #5fc1a1}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 #a58ce8;color:#fff}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #efd5dd}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.link{display:block;margin:16px auto 0;background:none;border:0;color:var(--soft);font-size:17px;text-decoration:underline;text-underline-offset:3px}
.weekpaws{display:flex;justify-content:space-between;margin-top:16px}
.wp{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;color:var(--soft);flex:1}
.wp .dot{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 #f3d9e1}
.wp .dot svg{width:22px;height:22px}
.wp.today .dot{outline:3px solid var(--pink-l)}

/* ---------- 탭바 ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;justify-content:space-around;padding:8px 8px calc(var(--sab) + 8px);border-top:2px solid #fbe3ea;z-index:20}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Jua';font-size:13px;color:#c7b3bb;width:70px}
.tab svg{width:26px;height:26px;fill:currentColor}
.tab.on{color:var(--pink-d)}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-family:'Jua';font-size:24px;margin:4px 0 12px;font-weight:400}
h3{font-family:'Jua';font-size:19px;margin:0 0 10px;font-weight:400}

/* ---------- 시트 / 모달 ---------- */
.dim{position:fixed;inset:0;background:rgba(90,60,70,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.dim.on{display:flex;animation:fadeIn .2s}
.dim.center{align-items:center;padding:20px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:22px 18px calc(var(--sab) + 22px);animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
.dim.center .sheet{border-radius:28px;padding:24px 20px;text-align:center;max-width:380px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.chip{border:0;border-radius:18px;padding:14px 6px;font-family:'Jua';font-size:19px;background:var(--c,#eee);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.chip small{display:block;font-family:'Gaegu';font-size:14px;opacity:.75;margin-top:2px}
.chip.sel{outline:3px solid var(--ink)}
.sheet .hint{font-size:17px;color:var(--soft);margin:-6px 0 14px}

/* ---------- 집중 화면 ---------- */
#focus{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;
  padding:calc(var(--sat) + 22px) 16px calc(var(--sab) + 22px)}
#focus.on{display:flex}
.fsub{font-family:'Jua';font-size:18px;padding:6px 16px;border-radius:99px;background:var(--c,#fff)}
.ring{position:relative;width:250px;height:250px;margin:18px 0 4px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:'Jua';font-size:54px;letter-spacing:1px}
.ring .small{font-size:18px;color:var(--soft)}
.fline{font-size:21px;text-align:center;min-height:2.6em;line-height:1.3;max-width:340px;margin:6px 0 0}
#focus .stage{width:100%;margin:0;flex:1;min-height:190px;max-width:520px}
.fbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;width:100%;max-width:420px}

/* ---------- 기록 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.cal .h{font-family:'Jua';font-size:14px;color:var(--soft)}
.cal .d{aspect-ratio:1;border-radius:12px;background:#fff7f9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:#c8b3bb;position:relative}
.cal .d svg{width:62%;height:62%}
.cal .d .n{position:absolute;top:2px;left:5px;font-size:11px}
.cal .d.today{outline:2px solid var(--pink)}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calnav button{background:#fff;border:0;border-radius:12px;width:38px;height:38px;font-family:'Jua';font-size:18px;box-shadow:0 2px 0 #f3d9e1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border-radius:18px;padding:10px 6px;text-align:center;box-shadow:0 3px 0 #f5dbe3}
.stat b{display:block;font-family:'Jua';font-size:22px;font-weight:400;color:var(--pink-d)}
.stat span{font-size:14px;color:var(--soft)}
.bar{display:grid;grid-template-columns:62px 1fr 56px;align-items:center;gap:8px;margin:8px 0;font-size:17px}
.bar .tr{height:16px;background:#fff4f7;border-radius:10px;overflow:hidden}
.bar .fl{height:100%;border-radius:10px;background:var(--c);transition:width .6s}
.bar .v{text-align:right;color:var(--soft);font-size:15px}

/* ---------- 꾸미기 ---------- */
.preview{height:170px;position:relative;background:linear-gradient(#fff 0 70%,#ffe6ee 70%);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
#decoStage .catwrap{left:50%;margin-left:-80px;width:160px;height:128px;bottom:12px}
#decoStage .ph{width:124px;height:124px;margin-left:-62px}
.furs{display:flex;gap:10px;margin-bottom:18px}
.fur{flex:1;border:0;border-radius:18px;padding:10px 4px 8px;background:#fff;box-shadow:0 3px 0 #f5dbe3;font-family:'Jua';font-size:15px}
.fur i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 4px;border:3px solid var(--line)}
.fur.sel{outline:3px solid var(--pink)}
.accs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.accb{border:0;border-radius:18px;background:#fff;padding:12px 6px 10px;box-shadow:0 3px 0 #f5dbe3;font-family:'Jua';font-size:15px;position:relative;overflow:hidden}
.accplate{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;
  background:var(--pc,#ffe0e9);box-shadow:inset 0 -3px 0 rgba(0,0,0,.07)}
.accplate svg{width:38px;height:38px;overflow:visible}
.accb.tier-top:not(.lock) .accplate{background:linear-gradient(160deg,#fff3cf,#ffd35c);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.07),0 0 0 3px #fff,0 0 12px rgba(255,211,92,.65)}
.accb .need{display:flex;align-items:center;justify-content:center;gap:3px;font-family:'Gaegu';font-size:12.5px;color:var(--soft);margin-top:1px}
.accb .need svg{width:12px;height:12px;flex:none}
.accb.lock .accplate{background:#efe4e8}
.accb.lock .accplate svg{filter:grayscale(1);opacity:.5}
.accb.on{outline:3px solid var(--pink)}
.accb.on:after{content:"✓";position:absolute;top:6px;right:8px;width:19px;height:19px;border-radius:50%;
  background:var(--pink);color:#fff;font-size:12px;line-height:19px;font-family:'Jua'}

/* ---------- 설정 ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-family:'Jua';font-size:16px;margin-bottom:6px}
.inp{width:100%;border:0;border-radius:16px;padding:13px 14px;font-size:20px;background:#fff;box-shadow:inset 0 0 0 2px #f6dce4;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{box-shadow:inset 0 0 0 3px var(--pink)}
.steps{margin:6px 0 0;padding-left:22px;line-height:1.55;font-size:18px}
.note{font-size:16px;color:var(--soft);line-height:1.4}
textarea.inp{height:90px;font-size:13px;font-family:ui-monospace,monospace;resize:none}
.sec{margin-bottom:16px}

/* ---------- 온보딩 ---------- */
#onb{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;display:none;padding:calc(var(--sat) + 20px) 18px calc(var(--sab) + 24px)}
#onb.on{display:block}
#onb .in{max-width:460px;margin:0 auto}
.big-title{font-family:'Jua';font-size:30px;text-align:center;margin:6px 0 2px;color:var(--pink-d)}
.big-sub{text-align:center;font-size:20px;margin:0 0 6px}

.mini{width:120px;height:96px;margin:0 auto}
.rewardnum{font-family:'Jua';font-size:30px;color:var(--pink-d);margin:6px 0}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-80px);background:#fff;border-radius:16px;padding:10px 16px;
  box-shadow:0 4px 0 #f1d3dd;z-index:80;transition:transform .3s;font-size:18px;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}

/* ---------- 사문 ---------- */
.smscore{text-align:center;margin-bottom:14px}
.smscore .lbl{font-family:'Jua';font-size:17px;color:var(--soft)}
.smscore .big{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:2px 0 8px}
.smscore .big b{font-family:'Jua';font-weight:400;font-size:56px;color:var(--pink-d);line-height:1}
.smscore .gr{font-family:'Jua';font-size:20px;background:var(--pink-l);color:var(--pink-d);border-radius:99px;padding:3px 12px}
.smscore .meter{height:8px;background:#fff0f4;border-radius:9px;overflow:hidden;margin:0 20px}
.smscore .meter i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .6s}
.smscore .note{margin:8px 0 0}
.smday{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 2px;font-family:'Jua';font-size:15px;color:var(--soft)}
.smday i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #f6d3de}
.smday i.on{background:var(--pink);box-shadow:none}
.smday span{margin-left:4px}
.btn:disabled{opacity:.45}
.smch{display:grid;grid-template-columns:1fr 70px 38px;align-items:center;gap:8px;width:100%;background:none;border:0;padding:7px 0;text-align:left;
  font-size:16px;border-bottom:1px dashed #f6dce4}
.smch:last-child{border-bottom:0}
.smch .t em{font-style:normal;font-family:'Jua';font-size:12px;color:#fff;background:#d9c6cf;border-radius:6px;padding:1px 5px;margin-right:5px}
.smch .hot{font-family:'Jua';font-weight:400;font-size:11px;color:var(--pink-d);background:var(--pink-l);border-radius:6px;padding:1px 5px}
.smch .tr{height:10px;background:#fff4f7;border-radius:8px;overflow:hidden}
.smch .tr i{display:block;height:100%;border-radius:8px}
.smch .v{text-align:right;font-size:14px;color:var(--soft)}
#quiz{position:fixed;inset:0;background:var(--bg);z-index:35;display:none;flex-direction:column;
  padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 16px);overflow-y:auto}
#quiz.on{display:flex}
.qzin{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.qztop{display:flex;align-items:center;gap:10px}
.qzx{border:0;background:#fff;border-radius:12px;width:38px;height:38px;font-family:'Jua';font-size:18px;box-shadow:0 2px 0 #f3d9e1;flex:none}
.qzprog{display:flex;gap:4px;flex:1}
.qzprog i{flex:1;height:8px;border-radius:5px;background:#fbe1e9}
.qzprog i.ok{background:var(--mint)} .qzprog i.no{background:var(--pink)} .qzprog i.cur{background:#f5b5c7}
.qzcat{width:44px;height:44px;border-radius:14px;border:3px solid #fff;flex:none;background:#ffe9ef center/cover no-repeat;box-shadow:0 2px 0 #f1cfd9;transition:transform .2s}
.qzcat.yay{transform:rotate(-8deg) scale(1.08)} .qzcat.hm{transform:rotate(6deg)}
.qztag{font-family:'Jua';font-size:14px;color:var(--soft);margin:12px 2px 6px}
.qztime{height:5px;background:#fbe1e9;border-radius:4px;overflow:hidden;margin-bottom:12px}
.qztime i{display:block;height:100%;width:100%;background:var(--butter);border-radius:4px}
.qztime i.late{background:#e9dde2}
.qzq{background:#fff;border-radius:var(--r);padding:18px;box-shadow:0 3px 0 #f5dbe3;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-weight:500;font-size:18.5px;line-height:1.55;letter-spacing:-.2px;-webkit-user-select:text;user-select:text}
.qzq p{margin:0}
.blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--pink);margin:0 3px;text-align:center;font-family:'Jua';font-size:15px;color:var(--pink-d);vertical-align:2px}
.qzq .qzlead{font-family:'Jua';font-size:16px;color:var(--soft);margin-bottom:6px}
.qzq .qzlead+p{margin-top:0}
.qzq table.dt{border-collapse:collapse;margin:10px 0;width:100%;font-size:16px;text-align:center}
.qzq .dt th,.qzq .dt td{border:1.5px solid #f3d3dd;padding:6px 4px}
.qzq .dt th{background:#fff6f8;font-family:'Jua';font-weight:400}
.qzq table+p{margin-top:8px}
.qzo{display:grid;gap:9px;margin-top:14px}
.qzo.ox{grid-template-columns:1fr 1fr}
.qzb{border:0;border-radius:18px;background:#fff;padding:14px 14px;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-weight:500;font-size:17px;text-align:left;box-shadow:0 4px 0 #efd5dd;line-height:1.3;
  transition:transform .08s}
.qzb:active{transform:translateY(3px)}
.qzo.ox .qzb{text-align:center;padding:18px 0}
.oxo,.oxx{font-family:'Jua';font-size:40px;line-height:1}
.oxo{color:#5fc1a1} .oxx{color:var(--pink-d)}
.qzb.right{background:var(--mint-l);box-shadow:0 4px 0 #8fdcc2;outline:3px solid #5fc1a1}
.qzb.wrong{background:#ffe3ea;box-shadow:0 4px 0 #f6b3c5;outline:3px solid var(--pink)}
.qzb:disabled{color:inherit}
.qzb .bn{font-style:normal;color:var(--pink-d);margin-right:4px}.qzb .sp{display:inline-block;width:14px}
.qzfb{display:none;margin-top:14px;border-radius:var(--r);padding:14px 16px;background:#fff;box-shadow:0 3px 0 #f5dbe3}
.qzfb.on{display:block;animation:up .25s}
.qzfb.ok{background:#effbf6} .qzfb.no{background:#fff1f5}
.qzfb .h{font-family:'Jua';font-size:20px;margin-bottom:4px}
.qzfb.ok .h{color:#3fa585} .qzfb.no .h{color:var(--pink-d)}
.qzfb .x{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-size:16px;line-height:1.5;margin-bottom:6px}
.qzfb .s{font-size:13px;color:var(--soft);margin-bottom:10px}
</style>
</head>

<script>
'use strict';
/* =========================================================
   냥공부 — 공부를 "계속하는 것" 자체에 의미를 두는 고양이 앱
   데이터는 전부 이 기기(localStorage)에만 저장된다.
   ========================================================= */
const VAPID_PUBLIC='BCfGAyW1pa1fwBGQly3B4ZzAqE31YWjDKxlRWL6pGTvfxlK9LCmtSnGUTpRjRdv8Z5y1XYTyR3e3phY83KwCq0g';
const KEY='nyang.v1';
const SUBJ=[
  {id:'kor', n:'국어', c:'#ffc2cf', tip:'지문 한 줄씩, 천천히 읽자'},
  {id:'math',n:'수학', c:'#bfe3f6', tip:'틀려도 돼. 틀린 문제가 제일 오래 남아'},
  {id:'eng', n:'영어', c:'#cdeebf', tip:'단어 하나만 더 친해지자'},
  {id:'soc', n:'사회문화', c:'#ffe3a8', tip:'개념 하나가 점수 하나야'},
  {id:'eth', n:'생활과윤리', c:'#dccdff', tip:'사상가 한 명만 더 친해지자'},
  {id:'etc', n:'기타', c:'#eee8f0', tip:'뭐든 좋아. 앉아 있는 게 대단한 거야'},
];
const FURS={
  cheese:{n:'치즈', fur:'#fff4e6',p1:'#f6b26b',p2:'#f6b26b',tail:'#f6b26b'},
  calico:{n:'삼색', fur:'#ffffff',p1:'#f4a261',p2:'#5b4d4d',tail:'#5b4d4d'},
  gray:  {n:'회색', fur:'#eceaf2',p1:'#b9b8cc',p2:'#b9b8cc',tail:'#b9b8cc'},
  white: {n:'하양', fur:'#ffffff',p1:'#ffffff',p2:'#ffffff',tail:'#ffffff'},
};
const ACCS=[
  {id:'bow',    n:'리본',     need:1,  pc:'#ffe0e9'},
  {id:'bell',   n:'방울 목걸이', need:3,  pc:'#fff2cf'},
  {id:'flower', n:'꽃 핀',    need:5,  pc:'#dcf6ec'},
  {id:'glasses',n:'공부 안경', need:10, pc:'#e8f2fb'},
  {id:'crown',  n:'왕관',     need:20, pc:'#fff2cf', top:1},
];

/* ---------- 사진 냥이: Pinterest에서 고른 치즈냥이들 (기분별) ---------- */
const PIN='https://i.pinimg.com/474x/';
const PHOTOS={
  happy:['a9/15/5a/a9155a0dd5459fc7b21ca56b8a7e9b72','6c/2b/5f/6c2b5f8a3392acd7c1de08e43c56d72f','72/74/fb/7274fb13e99d6e3920a6ee9bf9e42e9f','67/3c/1c/673c1cd4fdd120625f60805d43ed386a','ee/20/6e/ee206e31485ddca857415fffdedd1fd0','45/41/4e/45414e13115bae0a7b4e65419576fb92','fc/9c/51/fc9c51ce384762b2a7eeb77a4d652fc2'],
  normal:['1c/bd/f1/1cbdf169fed550d0d82305164cdc09aa','27/25/b4/2725b424267f3ae177bf8fa425517d29','cd/69/c6/cd69c6f3502cf7abae3cb4447d2a7fd0','4b/21/e1/4b21e1ec291318d33baed8b74c4dd785','69/9d/0b/699d0b2e1c5c1b93384fe1476aa41d0f'],
  tired:['c2/49/67/c2496783a903aca95f6b3c160db1f523','0d/a8/59/0da85976d654733c17b5bcfa08fef01a','cb/23/66/cb2366a8a7d0ff47258c2e5e6b1ae5aa','2c/7c/94/2c7c94173ac7e04d0f4b15db497b4dd0'],
  sleep:['58/26/a2/5826a2950feb322041a429b530b8858e','b1/ba/f8/b1baf8b0c88a8d0051ef65c32ca89b1e','76/2b/a6/762ba6a4b754cfdd5ad8fb43e553d473'],
  walk:['f5/2a/b5/f52ab55aabcd662b6402bc74cfb71446','b9/20/c2/b920c242be01f63aa12724e46108ac77','d2/5e/31/d25e31ca938a33549d591964730618d0','ab/da/c5/abdac55cf026974d5ae0d3d240d3475c','ec/70/db/ec70dbafd5e17a8b14273da157fa0f61'],
};
PHOTOS.rest=PHOTOS.sleep;
const photoUrl=id=>PIN+id+'.jpg';
Object.values(PHOTOS).flat().forEach(id=>{const i=new Image();i.src=photoUrl(id)});
const PACC={
  bow:'<svg viewBox="-14 -10 28 20"><path d="M0 0 L-12 -8 L-12 8 Z M0 0 L12 -8 L12 8 Z" fill="#ff7aa2" stroke="#5a4646" stroke-width="1.8" stroke-linejoin="round"/><circle r="3.6" fill="#ff5c8a" stroke="#5a4646" stroke-width="1.6"/></svg>',
  flower:'<svg viewBox="-10 -10.5 20 20"><g fill="#ffc9da" stroke="#5a4646" stroke-width="1.3"><circle cx="0" cy="-5" r="4.3"/><circle cx="4.8" cy="-1.5" r="4.3"/><circle cx="3" cy="4" r="4.3"/><circle cx="-3" cy="4" r="4.3"/><circle cx="-4.8" cy="-1.5" r="4.3"/></g><circle r="3" fill="#ffd35c" stroke="#5a4646" stroke-width="1.2"/></svg>',
  crown:'<svg viewBox="-13 -15 26 16"><path d="M-12 0 L-12 -11 L-6 -4.5 L0 -14 L6 -4.5 L12 -11 L12 0 Z" fill="#ffd35c" stroke="#5a4646" stroke-width="1.8" stroke-linejoin="round"/><circle cx="0" cy="-4" r="2" fill="#ff7aa2"/></svg>',
  bell:'<svg viewBox="-23 17 46 19"><path d="M-20 21 Q0 32 20 21" fill="none" stroke="#ff6b8b" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="29" r="5.2" fill="#ffd35c" stroke="#5a4646" stroke-width="1.8"/><path d="M-2.5 30.5h5" stroke="#5a4646" stroke-width="1.4"/></svg>',
  glasses:'<svg viewBox="-21 -8 42 20" fill="rgba(255,255,255,.35)" stroke="#6b4f4f" stroke-width="2.3"><circle cx="-11" cy="2" r="8.6"/><circle cx="11" cy="2" r="8.6"/><path d="M-2.4 1 Q0 -1.2 2.4 1" fill="none"/></svg>',
};
function stickerHTML(kind){const id=pick(PHOTOS[kind]||PHOTOS.happy);
  return `<div class="ph"><div class="pimg" style="background-image:url(${photoUrl(id)})"></div>${Object.entries(PACC).map(([k,v])=>`<div class="pacc ${k}">${v}</div>`).join('')}</div>`}

/* ---------- 저장 ---------- */
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.v===1) return {look:'photo',...s};}catch(e){}
  return {v:1,me:'',cat:'',fur:'cheese',look:'photo',dday:defaultDday(),sessions:[],rests:[],churu:0,wear:[],seenAcc:[],run:null,push:null,created:Date.now()};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} syncSW();}
function defaultDday(){const y=new Date().getMonth()>=11?new Date().getFullYear()+1:new Date().getFullYear();return y+'-11-19'}

/* ---------- 날짜: 새벽 4시까지는 전날로 친다 (늦게 공부하는 친구 배려) ---------- */
const z=n=>String(n).padStart(2,'0');
function dayOf(ts=Date.now()){const d=new Date(ts-4*3600e3);return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function kToDate(k){const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)}
function diffDays(a,b){return Math.round((kToDate(b)-kToDate(a))/864e5)}
function addDays(k,n){const d=kToDate(k);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function weekStart(k){const d=kToDate(k);const w=(d.getDay()+6)%7;return addDays(k,-w)}

/* ---------- 파생 값 ---------- */
function studyDays(){return [...new Set(S.sessions.map(s=>s.d))].sort()}
function minsOn(k){return S.sessions.filter(s=>s.d===k).reduce((a,s)=>a+s.m,0)}
function lastActive(){const a=[...studyDays(),...S.rests].sort();return a[a.length-1]||null}
function mood(){
  const t=dayOf();
  if(minsOn(t)>0) return 'happy';
  if(S.rests.includes(t)) return 'rest';
  const l=lastActive(); if(!l) return 'normal';
  const d=diffDays(l,t);
  return d<=1?'normal':d===2?'tired':'sleep';
}
function restLeft(){const ws=weekStart(dayOf());return S.rests.some(r=>r>=ws)?0:1}

/* ---------- 조사 처리: {cat이} → 모찌가 / 콩이 ---------- */
function hasBatchim(w){const c=w.charCodeAt(w.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0}
const JOSA={'이야':['이야','야'],'가':['이가','가'],'이':['이','가'],'은':['은','는'],'을':['을','를'],'야':['아','야'],'랑':['이랑','랑'],'와':['과','와']};
function fmt(t,x={}){return t.replace(/\{(me|cat|m)(이야|가|이|은|을|야|랑|와)?\}/g,(_,k,j)=>{
  const w=k==='m'?String(x.m??''):(k==='me'?(S.me||'친구'):(S.cat||'모찌'));
  return j?w+JOSA[j][hasBatchim(w)?0:1]:w;})}

class Walker{
  constructor(stage,{wander=true,speed=1}={}){
    this.stage=stage;this.wander=wander;this.spd=speed;
    this.el=document.createElement('div');this.el.className='catwrap';
    this.el.innerHTML='<div class="catflip">'+catSVG()+stickerHTML('happy')+'</div>';this.pimg=this.el.querySelector('.pimg');this.kind='happy';
    this.svg=this.el.querySelector('.cat');this.flip=this.el.querySelector('.catflip');
    this.bub=document.createElement('div');this.bub.className='bubble';
    stage.appendChild(this.el);stage.appendChild(this.bub);
    this.x=40;this.dir=1;this.target=null;this.wait=1;this.last=performance.now();this.mood='normal';this.zt=0;
    this.el.addEventListener('click',e=>{e.stopPropagation();this.onTap&&this.onTap(this)});
    if(wander) requestAnimationFrame(t=>this.loop(t)); else this.place();
  }
  setMood(m){this.mood=m;['happy','normal','tired','sleep','rest'].forEach(k=>{this.svg.classList.toggle('m-'+k,k===m);this.el.classList.toggle('m-'+k,k===m)});
    wearClasses(this.svg);wearClasses(this.el);this.el.classList.toggle('photo',S.look==='photo');this.updPhoto()}
  updPhoto(){
    const c=this.svg.classList,walking=c.contains('walking'),sleeping=this.asleep();
    this.el.classList.toggle('walking',walking);this.el.classList.toggle('sleeping',sleeping);
    const k=c.contains('pet')?'happy':sleeping?'sleep':c.contains('resting')?'tired':walking?'walk':this.mood==='rest'?'happy':this.mood;
    if(k!==this.kind){this.kind=k;this.pimg.style.backgroundImage=`url(${photoUrl(pick(PHOTOS[k]||PHOTOS.happy))})`}
  }
  w(){return this.stage.clientWidth||320}
  place(){this.el.style.transform=`translateX(${this.x}px)`;this.flip.style.setProperty('--dir',this.dir);this.flip.style.transform=`scaleX(${this.dir})`;
    if(this.bub.classList.contains('on')){const h=this.bub.offsetWidth/2+8;const cx=Math.max(h,Math.min(this.w()-h,this.x+70));this.bub.style.left=cx+'px'}}
  asleep(){return (this.mood==='sleep'||this.mood==='rest')&&!this.svg.classList.contains('awake')}
  loop(t){
    const dt=Math.min(.05,(t-this.last)/1000);this.last=t;
    if(!this.stage.isConnected||!this.stage.offsetParent){requestAnimationFrame(tt=>this.loop(tt));return}
    const W=this.w()-140;
    if(this.x>W) this.x=Math.max(0,W);
    if(this.asleep()||this.svg.classList.contains('resting')){
      this.svg.classList.remove('walking');
      this.zt-=dt;if(this.asleep()&&this.zt<=0){this.zzz();this.zt=1.3}
    }else if(this.target==null){
      this.svg.classList.remove('walking');this.wait-=dt;
      if(this.wait<=0){
        if(this.mood==='tired'&&Math.random()<.35){this.svg.classList.add('resting');setTimeout(()=>this.svg.classList.remove('resting'),5000+Math.random()*3000);this.wait=2;}
        else{let nx;do{nx=Math.random()*W}while(Math.abs(nx-this.x)<50&&W>60);this.target=nx;this.dir=nx>this.x?1:-1;}
      }
    }else{
      this.svg.classList.add('walking');
      const v=(this.mood==='tired'?24:this.mood==='happy'?66:48)*this.spd;
      this.x+=this.dir*v*dt;
      if((this.dir>0&&this.x>=this.target)||(this.dir<0&&this.x<=this.target)){
        this.x=this.target;this.target=null;this.wait=1.4+Math.random()*3.2;
        if(this.mood==='happy'&&Math.random()<.4) this.hop();
      }
    }
    this.updPhoto();this.place();requestAnimationFrame(tt=>this.loop(tt));
  }
  hop(){this.el.classList.remove('hop');void this.el.offsetWidth;this.el.classList.add('hop');this.hearts(2)}
  zzz(){const s=document.createElement('div');s.className='zzz';s.textContent=Math.random()<.5?'z':'Z';
    s.style.left=(this.x+(this.dir>0?118:22))+'px';s.style.bottom='112px';this.stage.appendChild(s);setTimeout(()=>s.remove(),2600)}
  hearts(n=5){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='heart';h.textContent='♥';
    h.style.left=(this.x+50+Math.random()*40)+'px';h.style.bottom=(90+Math.random()*20)+'px';h.style.setProperty('--hx',(Math.random()*60-30)+'px');
    h.style.animationDelay=(i*.09)+'s';h.style.color=pick(['#ff8fab','#ff6b95','#ffb3c6']);this.stage.appendChild(h);setTimeout(()=>h.remove(),1500)}}
  say(txt,ms=4200){this.bub.textContent=txt;this.bub.classList.add('on');this.place();clearTimeout(this.bt);this.bt=setTimeout(()=>this.bub.classList.remove('on'),ms)}
  face(cls,ms){this.svg.classList.add(cls);this.updPhoto();clearTimeout(this['f'+cls]);this['f'+cls]=setTimeout(()=>{this.svg.classList.remove(cls);this.updPhoto()},ms)}
}

function elapsed(){const r=S.run;if(!r)return 0;return r.acc+(r.pausedAt?0:Date.now()-r.start)}

let lastLine=0;
function updFocus(){
  const r=S.run;if(!r)return;const e=elapsed(),sec=Math.floor(e/1000);
  $('#f-time').textContent=z(Math.floor(sec/60))+':'+z(sec%60);
  const arc=$('#f-arc');
  if(r.goal){const p=Math.min(1,e/r.goal);arc.style.strokeDashoffset=553*(1-p);arc.style.stroke=p>=1?'#8fdcc2':'#ff8fab';
    if(p>=1&&!r.chimed){r.chimed=true;save();chime();focusCat.hop();focusCat.hearts(8);focusCat.say(say('goal'),5000);$('#f-goal').textContent='보너스 시간!'}}
  else{arc.style.strokeDashoffset=553*(1-((e/60000)%25)/25)}
  if(!r.pausedAt&&Date.now()-lastLine>70000){lastLine=Date.now();$('#f-line').textContent=Math.random()<.35?subj(r.s).tip:say('focus')}
}

function endFocus(){

function checkUnlock(){
  const n=studyDays().length,a=ACCS.find(a=>n>=a.need&&!S.seenAcc.includes(a.id));
  if(!a)return;S.seenAcc.push(a.id);if(!S.wear.includes(a.id))S.wear.push(a.id);save();renderAll();

function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}
function chime(){if(!audioCtx)return;const t=audioCtx.currentTime;[[784,0],[1047,.16],[1319,.32]].forEach(([f,d])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.5);
  o.connect(g).connect(audioCtx.destination);o.start(t+d);o.stop(t+d+.55)})}

function releaseWake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}

function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}

    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    S.push=sub.toJSON();save();renderSet();
    reg.showNotification(S.cat||'모찌',{body:fmt('알림 연결 완료! 이제 저녁마다 {cat이} 찾아올게'),icon:'icons/icon-192.png',tag:'hello'});

$('#b-export').onclick=async()=>{const {run,push,...rest}=S;const code='NYANGBAK:'+btoa(unescape(encodeURIComponent(JSON.stringify(rest))));
  try{await navigator.clipboard.writeText(code);toast('백업 코드 복사 완료! 메모장이나 카톡에 저장해 두세요')}catch(e){prompt('이 코드를 저장해 두세요',code)}};
$('#b-import').onclick=()=>{openSheet(`<h3>백업 불러오기</h3><p class="hint">저장해 둔 백업 코드를 붙여넣어 주세요.</p><textarea class="inp" id="imp"></textarea><br><br><button class="btn" id="imp-ok">불러오기</button>`);
  $('#imp-ok').onclick=()=>{try{const t=$('#imp').value.trim().replace(/^NYANGBAK:/,'');const d=JSON.parse(decodeURIComponent(escape(atob(t))));
    if(d.v!==1)throw 0;S={...load(),...d,push:S.push,run:null};save();closeSheet();applyFur();renderAll();toast('불러왔어요! 반가워')}catch(e){toast('코드가 올바르지 않아요')}}};

/* ---------- 서비스워커에 상태 전달 (알림 문구를 기기에서 고르기 위해) ---------- */
function syncSW(){
  if(!('caches' in window))return;
  const recent=studyDays().slice(-14);
  const state={me:S.me||'친구',cat:S.cat||'모찌',days:recent,rests:S.rests.slice(-7),dday:S.dday,total:studyDays().length};
  caches.open('nyang-state').then(c=>c.put('state.json',new Response(JSON.stringify(state),{headers:{'content-type':'application/json'}}))).catch(()=>{});
}

/* ---------- 탭 ---------- */
function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.v===v));window.scrollTo(0,0);renderAll()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));
function renderAll(){renderHome();if($('#v-sm').classList.contains('on'))SM.render();if($('#v-rec').classList.contains('on'))renderRec();if($('#v-deco').classList.contains('on'))renderDeco();if($('#v-set').classList.contains('on'))renderSet()}

$('#b-start').onclick=()=>subjectSheet(durationSheet);
$('#b-five').onclick=()=>subjectSheet(s=>{closeSheet();startFocus(s,5)});
$('#b-log').onclick=logSheet;
$('#b-rest').onclick=restDay;
$('#f-pause').onclick=togglePause;
$('#f-end').onclick=endFocus;
$('#qz-x').onclick=()=>SM.quit();

/* ---------- 시작 ---------- */
function boot(){
  applyFur();
  homeCat=new Walker($('#homeStage'));homeCat.onTap=homeTap;
  focusCat=new Walker($('#focusStage'),{speed:.8});focusCat.onTap=c=>{c.face('pet',1400);c.hearts(4);c.say(say('focus'),3000)};
  decoCat=new Walker($('#decoStage'),{wander:false});decoCat.x=0;decoCat.onTap=c=>{c.face('pet',1400);c.hearts(5);c.say(say('pet'),2500)};
  decoCat.el.style.left='50%';decoCat.el.style.marginLeft='-80px';decoCat.el.style.transform='none';decoCat.place=()=>{};decoCat.bub.style.left='50%';
  renderAll();
  if(S.run) showFocus();
  setInterval(chatter,16000);setTimeout(chatter,1600);
  if(!S.me){
    $('#onb').classList.add('on');
    onbCat=new Walker($('#onbStage'));onbCat.setMood('happy');onbCat.onTap=c=>{c.face('pet',1400);c.hearts(5);c.say('반가워!',2000)};
    $('#o-go').onclick=()=>{const me=$('#o-me').value.trim();if(!me){toast('너를 부를 이름을 알려줘');return}
      S.me=me;S.cat=$('#o-cat').value.trim()||'모찌';save();$('#onb').classList.remove('on');renderAll();
      homeCat.hop();homeCat.say(fmt('반가워 {me}! 나는 {cat이야}. 오늘부터 잘 부탁해'),6000)};
  }
  const q=new URLSearchParams(location.search);
  if(q.get('from')==='push'&&S.me&&!S.run){setTimeout(()=>{if(mood()!=='happy')homeCat.say(say(mood()==='sleep'?'wake':'normal'),5000)},900)}
  syncSW();
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
boot();
</script>
</body>
</html>
