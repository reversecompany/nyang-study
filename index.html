<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>냥공부</title>
<meta name="description" content="고양이랑 매일 조금씩 공부하는 앱">
<meta name="theme-color" content="#fff3f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냥공부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff3f6; --card:#ffffff; --ink:#5a4650; --soft:#7d6870; --line:#5a4646;
  --pink:#ff8fab; --pink-d:#f06d92; --pink-l:#ffe0e9;
  --mint:#8fdcc2; --mint-l:#dcf6ec; --butter:#ffd98a; --butter-l:#fff2cf;
  --lav:#c9b6ff; --lav-l:#efe8ff; --sky:#9fd3f0;
  --fur:#fff4e6; --p1:#f6b26b; --p2:#f6b26b; --tail:#f6b26b;
  --frame-bd:#ffffff; --frame-bg:#ffe9ef; --frame-tape:transparent;
  --room-wall:transparent; --room-floor1:#ffe6ee; --room-floor2:#ffdbe6; --room-border:#ffd0de; --room-rug:#fff;
  --r:22px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'Gaegu','Jua',system-ui,sans-serif;font-size:19px;overflow-x:hidden;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,input{font-family:inherit;color:inherit}
.jua{font-family:'Jua',system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 96px)}

/* ---------- 상단 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-family:'Jua';font-size:24px;color:var(--pink-d);letter-spacing:-.5px}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:99px;padding:5px 11px 5px 8px;
  font-family:'Jua';font-size:15px;box-shadow:0 2px 0 #f3d9e1}
.pill svg{width:18px;height:18px}

.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:0 3px 0 #f5dbe3}
.greet{font-family:'Jua';font-size:22px;margin:0 0 4px}
.line{font-size:21px;line-height:1.35;margin:0;min-height:1.35em}
.today{margin-top:8px;font-size:17px;color:var(--soft)}

/* ---------- 무대 (고양이가 걷는 곳) ---------- */
.stage{position:relative;height:234px;margin:12px -16px 4px;overflow:hidden}
.stage .wall{position:absolute;inset:0 0 46px 0;background:var(--room-wall);transition:background .4s}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:58px;
  background:repeating-linear-gradient(90deg,var(--room-floor1) 0 38px,var(--room-floor2) 38px 76px);border-top:3px solid var(--room-border);transition:background .4s,border-color .4s}
.stage .rug{position:absolute;left:50%;bottom:10px;width:62%;height:26px;transform:translateX(-50%);
  border-radius:50%;background:var(--room-rug);opacity:.55;transition:background .4s}
.win{position:absolute;right:26px;top:14px;width:78px;height:64px;border-radius:14px;background:linear-gradient(#cfeafe,#eaf6ff);
  border:4px solid #fff;box-shadow:0 2px 0 #f3d4de}
.win:before,.win:after{content:"";position:absolute;background:#fff}
.win:before{left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%)}
.win:after{top:50%;left:0;right:0;height:4px;transform:translateY(-50%)}
.cloud{position:absolute;width:24px;height:9px;border-radius:9px;background:#fff;top:18px;left:8px;animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(60px)}}
.frame{position:absolute;left:26px;top:20px;width:44px;height:54px;background:#fff;border-radius:8px;box-shadow:0 2px 0 #f3d4de;
  display:grid;place-items:center;font-family:'Jua';font-size:11px;color:var(--pink-d);text-align:center;line-height:1.1}
.catwrap{position:absolute;bottom:14px;left:0;width:140px;height:112px;will-change:transform;cursor:pointer}
.catflip{width:100%;height:100%;transition:transform .18s}
.catwrap.hop .catflip{animation:hop .55s ease-out}
@keyframes hop{0%{transform:translateY(0) scaleX(var(--dir))}40%{transform:translateY(-26px) scaleX(var(--dir))}100%{transform:translateY(0) scaleX(var(--dir))}}
.bubble{position:absolute;bottom:158px;left:0;max-width:min(260px,calc(100vw - 40px));background:#fff;border-radius:16px;padding:8px 13px;
  font-size:18px;line-height:1.3;box-shadow:0 3px 0 #f1d3dd;transform:translateX(-50%);opacity:0;transition:opacity .3s;pointer-events:none;
  white-space:normal;width:max-content}
.bubble.on{opacity:1}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.zzz{position:absolute;font-family:'Jua';color:#b9a6e8;font-size:20px;pointer-events:none;animation:zz 2.6s ease-in infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(22px,-46px) scale(1.2)}}
.heart{position:absolute;color:var(--pink);font-size:22px;pointer-events:none;animation:heart 1.1s ease-out forwards}
@keyframes heart{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--hx),-70px) scale(1.3)}}

/* ---------- 고양이 SVG ---------- */
.cat{width:100%;height:100%;overflow:visible}
.cat .o{stroke:var(--line);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
.cat .fur{fill:var(--fur)} .cat .p1{fill:var(--p1)} .cat .p2{fill:var(--p2)}
.cat .leg{transform-box:fill-box;transform-origin:50% 12%}
.cat .tail{transform-box:fill-box;transform-origin:100% 100%}   /* 꼬리는 가만히 — 고양이는 기분 좋을 땐 꼬리를 흔들지 않고 골골거려요 */
.walking .leg.a{animation:legA .44s ease-in-out infinite alternate}
.walking .leg.b{animation:legB .44s ease-in-out infinite alternate}
.walking .bodyg{animation:bob .22s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
@keyframes legB{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.m-tired.walking .leg.a,.m-tired.walking .leg.b{animation-duration:.9s}
.m-tired.walking .bodyg{animation-duration:.45s}
.eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eyes-happy,.eyes-closed,.eyes-tired,.sweat{display:none}
.sleeppose{display:none}
.m-sleep:not(.awake) .walkpose,.m-rest:not(.awake) .walkpose,.resting .walkpose{display:none}
.m-sleep:not(.awake) .sleeppose,.m-rest:not(.awake) .sleeppose,.resting .sleeppose{display:inline}
.sleeppose .eyes-open{display:none} .sleeppose .eyes-closed{display:inline}
.m-tired .eyes-open{display:none} .m-tired .eyes-tired{display:inline} .m-tired .sleeppose .eyes-closed{display:none}
.m-tired .sweat{display:inline}
.head{transform-box:fill-box;transform-origin:50% 50%}
.m-tired .head{transform:translateY(5px) rotate(6deg)}
.pet .walkpose .eyes-open,.pet .walkpose .eyes-tired,.happyface .walkpose .eyes-open{display:none}
.pet .walkpose .eyes-happy,.happyface .walkpose .eyes-happy{display:inline}
.acc{display:none}
/* ---------- 사진 냥이 (스티커) ---------- */
.ph{display:none;position:absolute;left:50%;bottom:22px;width:112px;height:112px;margin-left:-56px;transform-origin:50% 100%}
.photo .ph{display:block} .photo .cat{display:none}
.pimg{width:100%;height:100%;border-radius:28px;border:5px solid var(--frame-bd);background-color:var(--frame-bg);
  background-position:center;background-size:cover;background-repeat:no-repeat;
  box-shadow:0 5px 0 #f1cfd9,0 10px 18px rgba(120,60,80,.13);transition:background-image .2s,border-color .3s,background-color .3s}
.ftape{position:absolute;width:34px;height:16px;background:var(--frame-tape);opacity:.85;box-shadow:0 1px 2px rgba(0,0,0,.08);pointer-events:none;transition:background .3s}
.ftape.a{left:-6px;top:6px;transform:rotate(-18deg)}
.ftape.b{right:-6px;bottom:10px;transform:rotate(14deg)}
.mini .ftape{width:22px;height:11px}
.photo.walking .ph{animation:wob .44s ease-in-out infinite alternate}
.photo.walking.m-tired .ph{animation-duration:.9s}
.photo.sleeping .ph{animation:breathe 3s ease-in-out infinite}
@keyframes wob{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-7px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035,1.02)}}
.pacc{position:absolute;display:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
.w-bow .pacc.bow{display:block;right:-14px;top:-14px;width:44px}
.w-flower .pacc.flower{display:block;left:-10px;top:-10px;width:30px}
.w-crown .pacc.crown{display:block;left:50%;top:-24px;width:40px;margin-left:-20px}
.w-bell .pacc.bell{display:block;left:50%;bottom:-27px;width:70px;margin-left:-35px}
.w-glasses .pacc.glasses{display:block;right:-18px;bottom:-8px;width:50px;transform:rotate(12deg)}
.w-headband .pacc.headband{display:block;left:50%;top:-17px;width:50px;margin-left:-25px}
.w-bowtie .pacc.bowtie{display:block;left:50%;bottom:-17px;width:36px;margin-left:-18px}
.w-scarf .pacc.scarf{display:block;left:50%;bottom:-31px;width:80px;margin-left:-40px}
.mini .ph{display:block;position:relative;left:0;margin:0 auto;bottom:0}
.looks{display:flex;gap:10px;margin-bottom:18px}
.w-bow .acc-bow,.w-bell .acc-bell,.w-flower .acc-flower,.w-glasses .acc-glasses,.w-crown .acc-crown,
.w-headband .acc-headband,.w-bowtie .acc-bowtie,.w-scarf .acc-scarf{display:inline}

/* ---------- 버튼 ---------- */
.btn{display:block;width:100%;border:0;border-radius:20px;padding:15px 12px;font-family:'Jua';font-size:22px;cursor:pointer;
  background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.btn.sub{font-size:18px;padding:12px 8px;color:var(--ink)}
.btn.butter{background:var(--butter);box-shadow:0 5px 0 #eebd57}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #5fc1a1}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 #a58ce8;color:#fff}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #efd5dd}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.link{display:block;margin:16px auto 0;background:none;border:0;color:var(--soft);font-size:17px;text-decoration:underline;text-underline-offset:3px}
.weekpaws{display:flex;justify-content:space-between;margin-top:16px}
.wp{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;color:var(--soft);flex:1}
.wp .dot{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 #f3d9e1}
.wp .dot svg{width:22px;height:22px}
.wp.today .dot{outline:3px solid var(--pink-l)}

/* ---------- 탭바 ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;justify-content:space-around;padding:8px 8px calc(var(--sab) + 8px);border-top:2px solid #fbe3ea;z-index:20}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Jua';font-size:13px;color:#c7b3bb;width:70px}
.tab svg{width:26px;height:26px;fill:currentColor}
.tab.on{color:var(--pink-d)}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-family:'Jua';font-size:24px;margin:4px 0 12px;font-weight:400}
h3{font-family:'Jua';font-size:19px;margin:0 0 10px;font-weight:400}

/* ---------- 시트 / 모달 ---------- */
.dim{position:fixed;inset:0;background:rgba(90,60,70,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.dim.on{display:flex;animation:fadeIn .2s}
.dim.center{align-items:center;padding:20px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:22px 18px calc(var(--sab) + 22px);animation:up .28s cubic-bezier(.2,.9,.3,1.2);
  max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dim.center .sheet{border-radius:28px;padding:24px 20px;text-align:center;max-width:380px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.chip{border:0;border-radius:18px;padding:14px 6px;font-family:'Jua';font-size:19px;background:var(--c,#eee);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.chip small{display:block;font-family:'Gaegu';font-size:14px;opacity:.75;margin-top:2px}
.chip.sel{outline:3px solid var(--ink)}
.sheet .hint{font-size:17px;color:var(--soft);margin:-6px 0 14px}

/* ---------- 집중 화면 ---------- */
#focus{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;
  padding:calc(var(--sat) + 22px) 16px calc(var(--sab) + 22px)}
#focus.on{display:flex}
.fsub{font-family:'Jua';font-size:18px;padding:6px 16px;border-radius:99px;background:var(--c,#fff)}
.ring{position:relative;width:250px;height:250px;margin:18px 0 4px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:'Jua';font-size:54px;letter-spacing:1px}
.ring .small{font-size:18px;color:var(--soft)}
.fline{font-size:21px;text-align:center;min-height:2.6em;line-height:1.3;max-width:340px;margin:6px 0 0}
#focus .stage{width:100%;margin:0;flex:1;min-height:190px;max-width:520px}
.fbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;width:100%;max-width:420px}

/* ---------- 기록 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.cal .h{font-family:'Jua';font-size:14px;color:var(--soft)}
.cal .d{height:64px;border-radius:12px;background:#fff7f9;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0;padding:0 0 5px;font-size:14px;color:#c8b3bb;position:relative;overflow:hidden}
.cal .d svg{width:24px;height:24px;flex:none}
.cal .d .n{position:absolute;top:4px;left:6px;font-size:11px;line-height:1}
.cal .d .tm{font-family:'Jua';font-size:11.5px;line-height:1.15;color:var(--pink-d);white-space:nowrap;margin-top:1px}
.cal .d.today{background:#fff;box-shadow:inset 0 0 0 2px var(--pink)}
.cal .d.today .n{color:var(--pink-d);font-family:'Jua'}
.cal .d.go{cursor:pointer}
.cal .d.fut{opacity:.55}
/* 하루 기록 고치기·지우기 */
.srows{display:grid;gap:8px;margin-bottom:4px}
.srow{display:flex;align-items:center;gap:10px;background:#fff7f9;border-radius:16px;padding:10px 10px 10px 12px}
.srow>i{width:10px;height:34px;border-radius:5px;flex:none}
.srow .si{flex:1;min-width:0}.srow .si b{display:block;font-family:'Jua';font-weight:400;font-size:18px}
.srow .si span{display:block;font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow button{border:0;border-radius:12px;padding:8px 10px;font-family:'Jua';font-size:15px;background:#fff;box-shadow:0 2px 0 #efd5dd;flex:none}
.srow .sdel{color:var(--pink-d)}
.mstep{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 6px}
.mstep button{border:0;border-radius:14px;width:46px;height:44px;flex:none;font-family:'Jua';font-size:17px;background:#ffe7ee;box-shadow:0 3px 0 #f6c9d6}
.mstep b{font-family:'Jua';font-weight:400;font-size:22px;min-width:100px;text-align:center;color:var(--pink-d);white-space:nowrap}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calnav button{background:#fff;border:0;border-radius:12px;width:38px;height:38px;font-family:'Jua';font-size:18px;box-shadow:0 2px 0 #f3d9e1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border-radius:18px;padding:10px 6px;text-align:center;box-shadow:0 3px 0 #f5dbe3}
.stat b{display:block;font-family:'Jua';font-size:22px;font-weight:400;color:var(--pink-d)}
.stat span{font-size:14px;color:var(--soft)}
.bar{display:grid;grid-template-columns:62px 1fr 78px;align-items:center;gap:8px;margin:8px 0;font-size:17px}
.bar .tr{height:16px;background:#fff4f7;border-radius:10px;overflow:hidden}
.bar .fl{height:100%;border-radius:10px;background:var(--c);transition:width .6s}
.bar .v{text-align:right;color:var(--soft);font-size:15px}

/* ---------- 꾸미기 ---------- */
.preview{height:204px;position:relative;background:linear-gradient(#fff 0 70%,#ffe6ee 70%);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
#decoStage .catwrap{left:50%;margin-left:-80px;width:160px;height:128px;bottom:12px}
#decoStage .ph{width:124px;height:124px;margin-left:-62px}
.furs{display:flex;gap:10px;margin-bottom:18px}
.fur{flex:1;border:0;border-radius:18px;padding:10px 4px 8px;background:#fff;box-shadow:0 3px 0 #f5dbe3;font-family:'Jua';font-size:15px}
.fur i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 4px;border:3px solid var(--line)}
.fur.sel{outline:3px solid var(--pink)}
.accs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.accb{border:0;border-radius:18px;background:#fff;padding:12px 6px 10px;box-shadow:0 3px 0 #f5dbe3;font-family:'Jua';font-size:15px;position:relative;overflow:hidden}
.accplate{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;
  background:var(--pc,#ffe0e9);box-shadow:inset 0 -3px 0 rgba(0,0,0,.07)}
.accplate svg{width:38px;height:38px;overflow:visible}
.accb.tier-top:not(.lock) .accplate{background:linear-gradient(160deg,#fff3cf,#ffd35c);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.07),0 0 0 3px #fff,0 0 12px rgba(255,211,92,.65)}
.accb .need{display:flex;align-items:center;justify-content:center;gap:3px;font-family:'Gaegu';font-size:12.5px;color:var(--soft);margin-top:1px}
.accb .need svg{width:12px;height:12px;flex:none}
.accb.lock .accplate{background:#efe4e8}
.accb.lock .accplate svg{filter:grayscale(1);opacity:.5}
.accb.on{outline:3px solid var(--pink)}
.accb.on:after{content:"✓";position:absolute;top:6px;right:8px;width:19px;height:19px;border-radius:50%;
  background:var(--pink);color:#fff;font-size:12px;line-height:19px;font-family:'Jua'}

/* ---------- 상점 ---------- */
.shopbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.shopbar .bal{display:flex;align-items:center;gap:5px;background:var(--butter-l);border-radius:99px;padding:6px 14px;font-family:'Jua';font-size:16px;color:#a97a1f}
.shopbar .bal svg{width:18px;height:18px}
.shop-tabs{display:flex;gap:8px;margin-bottom:12px}
.shop-tab{flex:1;border:0;border-radius:16px;padding:10px 4px;background:#fff;box-shadow:0 3px 0 #f5dbe3;font-family:'Jua';font-size:15px;color:var(--soft)}
.shop-tab.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d)}
.cost{display:flex;align-items:center;justify-content:center;gap:3px;font-family:'Jua';font-size:13px;color:#a97a1f;margin-top:2px}
.cost svg{width:12px;height:12px;flex:none}
.accb.buy{background:#fffaf0}
.accb.buy .accplate{background:var(--pc,#fff2cf)}
.accb.cant{opacity:.55}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px}
.roomb{border:0;border-radius:18px;background:#fff;padding:0 0 10px;box-shadow:0 3px 0 #f5dbe3;font-family:'Jua';font-size:14px;position:relative;overflow:hidden;text-align:center}
.roomb .swatch{height:56px;display:flex}
.roomb .swatch i{flex:1}
.roomb .rn{display:block;margin-top:8px}
.roomb .cost{justify-content:center;margin-top:2px}
.roomb .swatch{background:#fff}
.roomb.on{outline:3px solid var(--pink)}
.roomb.on:after{content:"✓";position:absolute;top:6px;right:8px;width:19px;height:19px;border-radius:50%;
  background:var(--pink);color:#fff;font-size:12px;line-height:19px;font-family:'Jua'}
.roomb.cant{opacity:.55}
/* 구매 미리보기 — 상점에서 누르면 바로 사지 않고 여기서 한 번 더 확인 */
.stage.bpv{height:196px;margin:0 0 14px;border-radius:20px;background:var(--bg)}
.bpv .win{right:12px;top:10px;width:56px;height:46px}
.bpcat{position:absolute;left:50%;bottom:20px;width:140px;height:112px;margin-left:-70px}
.bpname{font-family:'Jua';font-size:24px;color:var(--pink-d);margin:0}
.bpcost{display:inline-flex;align-items:center;gap:5px;background:var(--butter-l);border-radius:99px;padding:5px 14px;margin-top:6px;
  font-family:'Jua';font-size:18px;color:#a97a1f}
.bpcost svg{width:20px;height:20px}

/* ---------- 설정 ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-family:'Jua';font-size:16px;margin-bottom:6px}
.inp{width:100%;border:0;border-radius:16px;padding:13px 14px;font-size:20px;background:#fff;box-shadow:inset 0 0 0 2px #f6dce4;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{box-shadow:inset 0 0 0 3px var(--pink)}
.steps{margin:6px 0 0;padding-left:22px;line-height:1.55;font-size:18px}
.note{font-size:16px;color:var(--soft);line-height:1.4}
textarea.inp{height:90px;font-size:13px;font-family:ui-monospace,monospace;resize:none}
.sec{margin-bottom:16px}

/* ---------- 온보딩 ---------- */
#onb{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;display:none;padding:calc(var(--sat) + 20px) 18px calc(var(--sab) + 24px)}
#onb.on{display:block}
#onb .in{max-width:460px;margin:0 auto}
.big-title{font-family:'Jua';font-size:30px;text-align:center;margin:6px 0 2px;color:var(--pink-d)}
.big-sub{text-align:center;font-size:20px;margin:0 0 6px}

.mini{width:120px;height:96px;margin:0 auto}
.rewardnum{font-family:'Jua';font-size:30px;color:var(--pink-d);margin:6px 0}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-80px);background:#fff;border-radius:16px;padding:10px 16px;
  box-shadow:0 4px 0 #f1d3dd;z-index:80;transition:transform .3s;font-size:18px;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}

/* ---------- 사문 ---------- */
.smscore{text-align:center;margin-bottom:14px}
.smscore .lbl{font-family:'Jua';font-size:17px;color:var(--soft)}
.smscore .big{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:2px 0 8px}
.smscore .big b{font-family:'Jua';font-weight:400;font-size:56px;color:var(--pink-d);line-height:1}
.smscore .gr{font-family:'Jua';font-size:20px;background:var(--pink-l);color:var(--pink-d);border-radius:99px;padding:3px 12px}
.smscore .meter{height:8px;background:#fff0f4;border-radius:9px;overflow:hidden;margin:0 20px}
.smscore .meter i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .6s}
.smscore .note{margin:8px 0 0}
.smday{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 2px;font-family:'Jua';font-size:15px;color:var(--soft)}
.smday i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #f6d3de}
.smday i.on{background:var(--pink);box-shadow:none}
.smday span{margin-left:4px}
.btn:disabled{opacity:.45}
.smch{display:grid;grid-template-columns:1fr 70px 38px;align-items:center;gap:8px;width:100%;background:none;border:0;padding:7px 0;text-align:left;
  font-size:16px;border-bottom:1px dashed #f6dce4}
.smch:last-child{border-bottom:0}
.smch .t em{font-style:normal;font-family:'Jua';font-size:12px;color:#fff;background:#d9c6cf;border-radius:6px;padding:1px 5px;margin-right:5px}
.smch .hot{font-family:'Jua';font-weight:400;font-size:11px;color:var(--pink-d);background:var(--pink-l);border-radius:6px;padding:1px 5px}
.smch .tr{height:10px;background:#fff4f7;border-radius:8px;overflow:hidden}
.smch .tr i{display:block;height:100%;border-radius:8px}
.smch .v{text-align:right;font-size:14px;color:var(--soft)}
.mockgrp{margin-bottom:12px}
.mockgrp:last-child{margin-bottom:0}
.mockhd{font-family:'Jua';font-size:15px;color:var(--soft);margin-bottom:2px}
.mockrow{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;padding:8px 0;border-bottom:1px dashed #f6dce4;font-size:16px}
.mockrow:last-child{border-bottom:0}
.mockrow>span:first-child{color:var(--soft);width:30px}
.mockrow>span.mockn{width:auto;color:#fff}
.mockrow b{font-family:'Jua';font-weight:400;font-size:19px;color:var(--pink-d)}
.mockd{font-family:'Jua';font-size:13px;color:var(--soft);background:#f7f0f2;border-radius:8px;padding:1px 7px}
.mockd.up{color:#3fa585;background:#e7f7f0}
.mockd.down{color:var(--pink-d);background:#ffe3ea}
.mockx{margin-left:auto;border:0;background:none;color:#d9c6cf;font-size:14px;padding:2px 6px}
#quiz{position:fixed;inset:0;background:var(--bg);z-index:35;display:none;flex-direction:column;
  padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 16px);overflow-y:auto}
#quiz.on{display:flex}
.qzin{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.qztop{display:flex;align-items:center;gap:10px}
.qzx{border:0;background:#fff;border-radius:12px;width:38px;height:38px;font-family:'Jua';font-size:18px;box-shadow:0 2px 0 #f3d9e1;flex:none}
.qzprog{display:flex;gap:4px;flex:1}
.qzprog i{flex:1;height:8px;border-radius:5px;background:#fbe1e9}
.qzprog i.ok{background:var(--mint)} .qzprog i.no{background:var(--pink)} .qzprog i.cur{background:#f5b5c7}
.qzcat{width:44px;height:44px;border-radius:14px;border:3px solid #fff;flex:none;background:#ffe9ef center/cover no-repeat;box-shadow:0 2px 0 #f1cfd9;transition:transform .2s}
.qzcat.yay{transform:rotate(-8deg) scale(1.08)} .qzcat.hm{transform:rotate(6deg)}
.qztag{font-family:'Jua';font-size:14px;color:var(--soft);margin:12px 2px 6px}
.qztime{height:5px;background:#fbe1e9;border-radius:4px;overflow:hidden;margin-bottom:12px}
.qztime i{display:block;height:100%;width:100%;background:var(--butter);border-radius:4px}
.qztime i.late{background:#e9dde2}
.qzq{background:#fff;border-radius:var(--r);padding:18px;box-shadow:0 3px 0 #f5dbe3;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-weight:500;font-size:18.5px;line-height:1.55;letter-spacing:-.2px;-webkit-user-select:text;user-select:text}
.qzq p{margin:0}
.blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--pink);margin:0 3px;text-align:center;font-family:'Jua';font-size:15px;color:var(--pink-d);vertical-align:2px}
.qzq .qzlead{font-family:'Jua';font-size:16px;color:var(--soft);margin-bottom:6px}
.qzq .qzlead+p{margin-top:0}
.qzq table.dt{border-collapse:collapse;margin:10px 0;width:100%;font-size:16px;text-align:center}
.qzq .dt th,.qzq .dt td{border:1.5px solid #f3d3dd;padding:6px 4px}
.qzq .dt th{background:#fff6f8;font-family:'Jua';font-weight:400}
.qzq table+p{margin-top:8px}
.qzo{display:grid;gap:9px;margin-top:14px}
.qzo.ox{grid-template-columns:1fr 1fr}
.qzb{border:0;border-radius:18px;background:#fff;padding:14px 14px;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-weight:500;font-size:17px;text-align:left;box-shadow:0 4px 0 #efd5dd;line-height:1.3;
  transition:transform .08s}
.qzb:active{transform:translateY(3px)}
.qzo.ox .qzb{text-align:center;padding:18px 0}
.oxo,.oxx{font-family:'Jua';font-size:40px;line-height:1}
.oxo{color:#5fc1a1} .oxx{color:var(--pink-d)}
.qzb.right{background:var(--mint-l);box-shadow:0 4px 0 #8fdcc2;outline:3px solid #5fc1a1}
.qzb.wrong{background:#ffe3ea;box-shadow:0 4px 0 #f6b3c5;outline:3px solid var(--pink)}
.qzb:disabled{color:inherit}
.qzb .bn{font-style:normal;color:var(--pink-d);margin-right:4px}.qzb .sp{display:inline-block;width:14px}
.qzfb{display:none;margin-top:14px;border-radius:var(--r);padding:14px 16px;background:#fff;box-shadow:0 3px 0 #f5dbe3}
.qzfb.on{display:block;animation:up .25s}
.qzfb.ok{background:#effbf6} .qzfb.no{background:#fff1f5}
.qzfb .h{font-family:'Jua';font-size:20px;margin-bottom:4px}
.qzfb.dk{background:#f5f1ff} .qzfb.dk .h{color:#8f76e0}
.qzdk{border:0;background:none;color:var(--soft);font-family:'Jua';font-size:17px;padding:10px;margin:2px auto 0;text-decoration:underline;text-underline-offset:4px;grid-column:1/-1}
.qzfb.ok .h{color:#3fa585} .qzfb.no .h{color:var(--pink-d)}
.qzfb .x{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-size:16px;line-height:1.5;margin-bottom:6px}
.qzfb .s{font-size:13px;color:var(--soft);margin-bottom:10px}

/* ---------- 레몬 앨범 (공부한 날마다 폴라로이드 한 장) ---------- */
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:4px 2px}
.pola{background:#fff;padding:6px 6px 0;border-radius:4px;box-shadow:0 3px 9px rgba(120,60,80,.16);transform:rotate(var(--rot,0deg));cursor:pointer}
.pola .pi{aspect-ratio:1;background:#f3e9ec center/cover no-repeat;border-radius:2px}
.pola .pd{font-family:'Gaegu';font-weight:700;font-size:14px;text-align:center;padding:3px 0 5px;color:var(--soft)}
.pola.big{width:210px;margin:2px auto 12px;padding:10px 10px 0;cursor:default}
.pola.big .pd{font-size:19px;padding:6px 0 8px}
.pola.dev .pi{animation:develop 3s ease-out}
@keyframes develop{0%{filter:brightness(2) saturate(0) blur(4px)}55%{filter:brightness(1.2) saturate(.5) blur(1px)}100%{filter:none}}
.pola.lock{background:#fff7f9;box-shadow:none;outline:2px dashed #f3d3dd;outline-offset:-2px;cursor:default}
.pola.lock .pi{background:none;display:grid;place-items:center;font-family:'Jua';font-size:26px;color:#e8c9d3}
.polafan{display:flex;justify-content:center;margin:6px 0 14px}
.polafan .pola{width:86px;margin:0 -8px;cursor:default}
.pcap{font-size:17px;color:var(--soft);margin:0 0 4px}

/* ---------- 숨 고르기 ---------- */
.breathbtn{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px auto 0;border:0;border-radius:99px;padding:9px 18px;
  background:var(--lav-l);color:#7d64d6;font-family:'Jua';font-size:16px;box-shadow:0 3px 0 #ddd0fb}
#breath{position:fixed;inset:0;z-index:36;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 24px);background:linear-gradient(#f4efff,#fff3f6)}
#breath.on{display:flex;animation:fade .4s}
.bcirc{position:relative;width:210px;height:210px;margin:26px 0 30px}
.bglow{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,#dccfff 0 55%,rgba(220,207,255,0) 71%);transform:scale(.8);transition:transform 4s ease-in-out}
.bphoto{position:absolute;inset:0;border-radius:50%;border:6px solid #fff;background:#efe8ff center/cover no-repeat;box-shadow:0 8px 24px rgba(125,100,214,.2);
  transform:scale(.86);transition:transform 4s ease-in-out}
.bphase{font-family:'Jua';font-size:30px;color:#7d64d6;min-height:1.3em;margin:0;text-align:center}
.bsub{font-size:19px;color:var(--soft);min-height:1.4em;margin:0;text-align:center;max-width:320px;line-height:1.4}
.bdots{display:flex;gap:8px;margin:6px 0 18px}.bdots i{width:10px;height:10px;border-radius:50%;background:#e6ddfb}.bdots i.on{background:#a58ce8}
#breath .btn{max-width:320px}

/* ---------- 2026-09-30 개편: 오늘 시간 / 하루 기록 / 그래프 / 집중 모드 ---------- */
.hgrid{display:block}
.hero{margin-top:12px;text-align:center;padding:14px 16px 16px}
.hero .hl{font-family:'Jua';font-size:16px;color:var(--soft)}
.hero .hb{font-family:'Jua';font-size:58px;line-height:1.08;color:var(--pink-d);margin:2px 0 4px;letter-spacing:-1px}
.hero .hb small{font-size:26px;margin:0 8px 0 3px;letter-spacing:0}
.hero .hs{display:flex;height:12px;border-radius:8px;overflow:hidden;background:#fff0f4;margin:8px 4px 10px}
.hero .hs i{display:block;height:100%}
.hero .hc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hero .hc span{font-family:'Jua';font-size:14.5px;padding:3px 11px;border-radius:99px;background:var(--c);color:var(--ink)}
.hero .today{margin:4px 0 0}
.seg{display:flex;gap:4px;background:#fff0f4;border-radius:16px;padding:4px;margin:0 0 12px}
.seg button{flex:1;border:0;border-radius:12px;padding:9px 2px;font-family:'Jua';font-size:15px;background:none;color:var(--soft)}
.seg button.on{background:#fff;color:var(--pink-d);box-shadow:0 2px 0 #f3d9e1}
.dsum{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:0 0 12px}
.dsum b{font-family:'Jua';font-weight:400;font-size:36px;line-height:1.1;color:var(--pink-d)}
.dsum span{font-size:16px;color:var(--soft)}
.sbar{display:grid;grid-template-columns:62px 1fr 92px;align-items:center;gap:8px;margin:9px 0;font-size:17px}
.sbar .tr{height:18px;background:#fff4f7;border-radius:10px;overflow:hidden}
.sbar .fl{height:100%;border-radius:10px;background:var(--c)}
.sbar .v{text-align:right;font-family:'Jua';font-size:16px}
.sbar .v small{display:block;font-family:'Gaegu';font-size:13px;color:var(--soft)}
.tt{display:grid;grid-template-columns:34px repeat(6,1fr);gap:2px;margin-bottom:10px}
.tt .th{font-family:'Jua';font-size:12px;color:var(--soft);text-align:center;padding:0 0 2px}
.tt .hr{font-family:'Jua';font-size:13px;color:var(--soft);text-align:right;padding-right:6px;align-self:center}
.tt .c{height:23px;background:#fff4f7;border-radius:5px;position:relative;overflow:hidden}
.tt .c i{position:absolute;top:0;bottom:0;left:0}
.tt .c.q0{border-radius:5px 0 0 5px}
.ttleg{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:14px;color:var(--soft);margin:2px 0 4px}
.ttleg span{display:inline-flex;align-items:center;gap:5px}
.ttleg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.dadd{margin-top:14px}
.inp.sm{padding:11px 12px;font-size:19px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mrow .inp{flex:1;min-width:0;text-align:center}
.mrow span{font-family:'Jua';font-size:18px;color:var(--soft)}
.mtot{font-family:'Jua';font-size:20px;color:var(--pink-d);text-align:center;min-height:1.4em;margin:2px 0 10px}
input[type=date].inp,input[type=time].inp{min-height:52px;font-family:'Jua',sans-serif;font-size:18px;text-align:center}
.chips.six{grid-template-columns:repeat(3,1fr)}
.chip.span2{grid-column:span 2}
.chips.mini6{gap:8px;margin-bottom:10px}
.chips.mini6 .chip{padding:10px 4px;font-size:17px}
/* 그래프 */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:'Jua',sans-serif;fill:var(--soft)}
.chart .gl{stroke:#f6dce4;stroke-width:1}
.chart .cut{stroke:#c9b6ff;stroke-width:1;stroke-dasharray:4 4}
.chart .cutl{font-size:10px;fill:#a58ce8}
.chart .ln{fill:none;stroke:var(--pink-d);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:url(#chg);stroke:none}
.chart .pt{fill:#fff;stroke:var(--pink-d);stroke-width:3}
.chart .pt.best{stroke:#3fa585;fill:#e7f7f0}
.chart .vl{font-size:13px;fill:var(--ink);text-anchor:middle}
.chart .xl{font-size:11px;text-anchor:middle}
.chart .yl{font-size:11px;text-anchor:end}
.chart .bar1{fill:var(--pink)}
.chart .bar1.today{fill:var(--pink-d)}
.chart .bar1.zero{fill:#f6dce4}
.chartnote{font-size:15px;color:var(--soft);margin:6px 0 0;text-align:center}
/* 모의고사 목록 */
.mockrow{cursor:pointer}
.mockn{font-family:'Jua';font-size:13px;color:#fff;background:#d9b6c3;border-radius:8px;padding:1px 8px;flex:none}
.mockrow.last .mockn{background:var(--pink)}
.mockrow .md{color:var(--soft);font-size:15px}
.mockrow .lb{font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.mockrow .est{font-size:12px;color:var(--pink-d);font-family:'Jua'}
.mockhead{display:flex;align-items:baseline;justify-content:space-between}
.msum{display:flex;gap:8px;margin:2px 0 10px}
.msum div{flex:1;background:#fff7f9;border-radius:14px;padding:8px 4px;text-align:center}
.msum b{display:block;font-family:'Jua';font-weight:400;font-size:20px;color:var(--pink-d)}
.msum span{font-size:13px;color:var(--soft)}
.smsub{font-size:14px;color:var(--soft);margin:6px 0 0;line-height:1.4}
/* 집중 모드 (고양이 얼굴만) */
.calmbtn{position:absolute;right:14px;top:calc(var(--sat) + 16px);border:0;border-radius:99px;padding:7px 14px;background:#fff;color:var(--soft);
  font-family:'Jua';font-size:14px;box-shadow:0 2px 0 #f3d9e1}
#focus .calmwrap{display:none}
#focus.calm .stage,#focus.calm .fline{display:none}
#focus.calm .calmwrap{display:flex;flex:1;width:100%;align-items:center;justify-content:center;min-height:0}
#focus.calm .ring{width:210px;height:210px;margin-top:10px}
#focus.calm .ring .big{font-size:46px}
.calmcat{position:relative;width:112px;height:112px;transform:scale(1.6);transform-origin:50% 50%}
.calmcat .ph{display:block;position:relative;left:0;bottom:0;margin:0;animation:breathe 4s ease-in-out infinite}
.calmcat.draw{width:240px;height:225px}
.calmcat.draw .cat{width:240px;height:225px}
/* 액자 테두리 무늬 + 새 꾸미기 */
.ph::before{content:"";position:absolute;inset:-9px;border-radius:var(--frame-rr,28%);clip-path:var(--frame-clip,none);background:var(--frame-ring,none);pointer-events:none}
.ph::after{content:"";position:absolute;inset:0;border-radius:var(--frame-r,25%);clip-path:var(--frame-clip,none);background:var(--frame-after,none);pointer-events:none}
.pimg{position:relative;border-width:var(--frame-bw,5px);border-bottom-width:var(--frame-bb,var(--frame-bw,5px));border-radius:var(--frame-r,25%);clip-path:var(--frame-clip,none)}
.w-garland .pacc.garland{display:block;left:-3px;top:-12px;width:122px}
.w-pearls .pacc.pearls{display:block;left:-4px;bottom:-15px;width:122px}
.w-heartpin .pacc.heartpin{display:block;left:-12px;top:-12px;width:34px}

/* ---------- 날짜: 새벽 4시까지는 전날로 친다 (늦게 공부하는 친구 배려) ---------- */
const z=n=>String(n).padStart(2,'0');
function dayOf(ts=Date.now()){const d=new Date(ts-4*3600e3);return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function kToDate(k){const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)}
function diffDays(a,b){return Math.round((kToDate(b)-kToDate(a))/864e5)}
function addDays(k,n){const d=kToDate(k);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function weekStart(k){const d=kToDate(k);const w=(d.getDay()+6)%7;return addDays(k,-w)}

/* ---------- 파생 값 ---------- */
function studyDays(){return [...new Set(S.sessions.map(s=>s.d))].sort()}
function minsOn(k){return S.sessions.filter(s=>s.d===k).reduce((a,s)=>a+s.m,0)}
function lastActive(){const a=[...studyDays(),...S.rests].sort();return a[a.length-1]||null}
function mood(){
  const t=dayOf();
  if(minsOn(t)>0) return 'happy';
  if(S.rests.includes(t)) return 'rest';
  const l=lastActive(); if(!l) return 'normal';
  const d=diffDays(l,t);
  return d<=1?'normal':d===2?'tired':'sleep';
}
function restLeft(){const ws=weekStart(dayOf());return S.rests.some(r=>r>=ws)?0:1}

function fmt(t,x={}){return t.replace(/\{(me|cat|m)(이야|가|이|은|을|야|랑|와)?\}/g,(_,k,j)=>{
  const w=k==='m'?String(x.m??''):(k==='me'?(S.me||'친구'):(S.cat||'모찌'));

class Walker{
  constructor(stage,{wander=true,speed=1}={}){
    this.stage=stage;this.wander=wander;this.spd=speed;
    this.el=document.createElement('div');this.el.className='catwrap';
    this.el.innerHTML='<div class="catflip">'+catSVG()+stickerHTML('happy')+'</div>';this.pimg=this.el.querySelector('.pimg');this.kind='happy';
    this.svg=this.el.querySelector('.cat');this.flip=this.el.querySelector('.catflip');
    this.bub=document.createElement('div');this.bub.className='bubble';
    stage.appendChild(this.el);stage.appendChild(this.bub);
    this.x=40;this.dir=1;this.target=null;this.wait=1;this.last=performance.now();this.mood='normal';this.zt=0;
    this.el.addEventListener('click',e=>{e.stopPropagation();this.onTap&&this.onTap(this)});
    if(wander) requestAnimationFrame(t=>this.loop(t)); else this.place();
  }
  setMood(m){this.mood=m;['happy','normal','tired','sleep','rest'].forEach(k=>{this.svg.classList.toggle('m-'+k,k===m);this.el.classList.toggle('m-'+k,k===m)});
    wearClasses(this.svg);wearClasses(this.el);this.el.classList.toggle('photo',S.look==='photo');this.updPhoto()}
  updPhoto(){
    const c=this.svg.classList,walking=c.contains('walking'),sleeping=this.asleep();
    this.el.classList.toggle('walking',walking);this.el.classList.toggle('sleeping',sleeping);
    const k=c.contains('pet')?'happy':sleeping?'sleep':c.contains('resting')?'tired':walking?'walk':this.mood==='rest'?'happy':this.mood;
    if(k!==this.kind){this.kind=k;this.pimg.style.backgroundImage=`url(${photoUrl(pick(PHOTOS[k]||PHOTOS.happy))})`}
  }
  w(){return this.stage.clientWidth||320}
  place(){this.el.style.transform=`translateX(${this.x}px)`;this.flip.style.setProperty('--dir',this.dir);this.flip.style.transform=`scaleX(${this.dir})`;
    if(this.bub.classList.contains('on')){const h=this.bub.offsetWidth/2+8;const cx=Math.max(h,Math.min(this.w()-h,this.x+70));this.bub.style.left=cx+'px'}}
  asleep(){return (this.mood==='sleep'||this.mood==='rest')&&!this.svg.classList.contains('awake')}
  loop(t){
    const dt=Math.min(.05,(t-this.last)/1000);this.last=t;
    if(!this.stage.isConnected||!this.stage.offsetParent){requestAnimationFrame(tt=>this.loop(tt));return}
    const W=this.w()-140;
    if(this.x>W) this.x=Math.max(0,W);
    if(this.asleep()||this.svg.classList.contains('resting')){
      this.svg.classList.remove('walking');
      this.zt-=dt;if(this.asleep()&&this.zt<=0){this.zzz();this.zt=1.3}
    }else if(this.target==null){
      this.svg.classList.remove('walking');this.wait-=dt;
      if(this.wait<=0){
        if(this.mood==='tired'&&Math.random()<.35){this.svg.classList.add('resting');setTimeout(()=>this.svg.classList.remove('resting'),5000+Math.random()*3000);this.wait=2;}
        else{let nx;do{nx=Math.random()*W}while(Math.abs(nx-this.x)<50&&W>60);this.target=nx;this.dir=nx>this.x?1:-1;}
      }
    }else{
      this.svg.classList.add('walking');
      const v=(this.mood==='tired'?24:this.mood==='happy'?66:48)*this.spd;
      this.x+=this.dir*v*dt;
      if((this.dir>0&&this.x>=this.target)||(this.dir<0&&this.x<=this.target)){
        this.x=this.target;this.target=null;this.wait=1.4+Math.random()*3.2;
        if(this.mood==='happy'&&Math.random()<.4) this.hop();
      }
    }
    this.updPhoto();this.place();requestAnimationFrame(tt=>this.loop(tt));
  }
  hop(){this.el.classList.remove('hop');void this.el.offsetWidth;this.el.classList.add('hop');this.hearts(2)}
  zzz(){const s=document.createElement('div');s.className='zzz';s.textContent=Math.random()<.5?'z':'Z';
    s.style.left=(this.x+(this.dir>0?118:22))+'px';s.style.bottom='128px';this.stage.appendChild(s);setTimeout(()=>s.remove(),2600)}
  hearts(n=5){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='heart';h.textContent='♥';
    h.style.left=(this.x+50+Math.random()*40)+'px';h.style.bottom=(104+Math.random()*20)+'px';h.style.setProperty('--hx',(Math.random()*60-30)+'px');
    h.style.animationDelay=(i*.09)+'s';h.style.color=pick(['#ff8fab','#ff6b95','#ffb3c6']);this.stage.appendChild(h);setTimeout(()=>h.remove(),1500)}}
  say(txt,ms=4200){this.bub.textContent=txt;this.bub.classList.add('on');this.place();clearTimeout(this.bt);this.bt=setTimeout(()=>this.bub.classList.remove('on'),ms)}
  face(cls,ms){this.svg.classList.add(cls);this.updPhoto();clearTimeout(this['f'+cls]);this['f'+cls]=setTimeout(()=>{this.svg.classList.remove(cls);this.updPhoto()},ms)}
}

/* 츄르 = 1개 + 25분마다 1개씩 더 (1시간 3개, 2시간 5개, 3시간 8개). 예전엔 50분 넘으면 최대 3개에서 멈췄다. */

function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}
function chime(){if(!audioCtx)return;const t=audioCtx.currentTime;[[784,0],[1047,.16],[1319,.32]].forEach(([f,d])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.5);
  o.connect(g).connect(audioCtx.destination);o.start(t+d);o.stop(t+d+.55)})}

function tsOf(dk,hhmm){const[y,mo,d]=dk.split('-').map(Number),[h,mi]=hhmm.split(':').map(Number);

}

/* ---------- 하루 기록: 과목별 / 전체 / 10분 표 (2026-09-30 지연 피드백: 많아지면 스크롤도 안 되고 총 몇 시간인지 안 보임) ----------
   받은 츄르도 같이 맞춘다(타이머·직접 기록은 시간에 따라, 퀴즈는 받은 만큼). 0 밑으로는 안 내려간다. */
const HOW={timer:'타이머',log:'직접 기록',quiz:'사문 퀴즈'};
function gainOf(x){return x.c!=null?x.c:(x.h==='quiz'?1:churuOld(x.m))}
function hm(t){const d=new Date(t);return z(d.getHours())+':'+z(d.getMinutes())}
let dayTab='sub';
function subBody(list){
  const by={};list.forEach(x=>{const b=by[x.s]=by[x.s]||{m:0,n:0};b.m+=x.m;b.n++});
  const rows=Object.entries(by).sort((a,b)=>b[1].m-a[1].m),mx=rows[0][1].m,tot=list.reduce((a,x)=>a+x.m,0);
  return rows.map(([k,b])=>`<div class="sbar"><span>${subj(k).n.replace('생활과윤리','생윤').replace('사회문화','사문')}</span><div class="tr"><div class="fl" style="--c:${subj(k).c};width:${b.m/mx*100}%"></div></div>
    <span class="v">${fmtMin(b.m)}<small>${b.n}번 · ${Math.round(b.m/tot*100)}%</small></span></div>`).join('');
}
function allBody(list){
  return `<div class="srows">${list.map(x=>`<div class="srow"><i style="background:${subj(x.s).c}"></i><div class="si"><b>${subj(x.s).n} · ${fmtMin(x.m)}</b><span>${hm(x.t-x.m*60000)} – ${hm(x.t)}${x.h==='timer'?'':' · '+(HOW[x.h]||'기록')}</span></div>
    <button class="sedit" data-t="${x.t}">고치기</button><button class="sdel" data-t="${x.t}">지우기</button></div>`).join('')}</div>`;
}
/* 10분 표: 한 줄 = 1시간, 한 칸 = 10분. 공부한 시간대만 과목 색으로 칠해진다. 하루는 새벽 4시부터. */
function ttBody(k,list){
  const[y,mo,d]=k.split('-').map(Number),start=new Date(y,mo-1,d,4).getTime(),U=600000;
  const cells=Array.from({length:144},()=>[]);let lo=143,hi=0;
  list.forEach(x=>{const a=Math.max(x.t-x.m*60000,start),b=Math.min(x.t,start+864e5);if(b<=a)return;
    for(let i=Math.floor((a-start)/U);i<=Math.floor((b-1-start)/U);i++){const cs=start+i*U,ov=Math.min(b,cs+U)-Math.max(a,cs);
      if(ov<=0)continue;cells[i].push({l:(Math.max(a,cs)-cs)/U*100,w:ov/U*100,c:subj(x.s).c});lo=Math.min(lo,i);hi=Math.max(hi,i)}});
  if(hi<lo)return '<p class="note" style="text-align:center">이 날은 표에 그릴 시간이 없어요</p>';
  const r0=Math.floor(lo/6),r1=Math.floor(hi/6);
  let h='<div class="tt"><span></span>'+[0,10,20,30,40,50].map(v=>`<span class="th">${v}</span>`).join('');
  for(let r=r0;r<=r1;r++){h+=`<span class="hr">${(4+r)%24}시</span>`;
    for(let c=0;c<6;c++)h+=`<div class="c">${cells[r*6+c].map(q=>`<i style="left:${q.l}%;width:${q.w}%;background:${q.c}"></i>`).join('')}</div>`}
  h+='</div>';
  const used=[...new Set(list.map(x=>x.s))];
  return h+`<div class="ttleg">${used.map(id=>`<span><i style="background:${subj(id).c}"></i>${subj(id).n}</span>`).join('')}<span>한 칸 = 10분</span></div>`;
}
function daySheet(k,tab){
  if(tab)dayTab=tab;

  const body=!list.length?'<p class="note" style="text-align:center;margin:20px 0">이날은 아직 기록이 없어요</p>':dayTab==='all'?allBody(list):dayTab==='tt'?ttBody(k,list):subBody(list);
  openSheet(`<h3 style="margin:0 0 6px">${dayTitle(k)}</h3>
    <div class="dsum"><b>${tot?fmtMin(tot):'쉬는 날'}</b><span>${list.length?`${list.length}번 · ${subN}과목`:''}</span></div>
    ${list.length?`<div class="seg">${[['sub','과목별'],['all','전체 기록'],['tt','10분 표']].map(([id,n])=>`<button data-tab="${id}" class="${dayTab===id?'on':''}">${n}</button>`).join('')}</div>`:''}
    ${body}

/* ---------- 그래프 (모의고사 점수·최근 2주 공부 시간) ---------- */
let chartN=0;
function lineChart(pts,o={}){
  const W=340,H=o.h||200,L=28,R=42,T=24,B=30,step=o.step||5,vs=pts.map(p=>p.v),id='chg'+(++chartN);
  const lo=o.min!=null?o.min:Math.max(0,Math.floor((Math.min(...vs)-4)/step)*step);
  let hi=o.max!=null?o.max:Math.min(o.ceil||50,Math.ceil((Math.max(...vs)+3)/step)*step);if(hi-lo<step*2)hi=lo+step*2;
  const X=i=>pts.length===1?(L+W-R)/2:L+(W-L-R)*i/(pts.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let v=lo;v<=hi;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="yl" x="${L-5}" y="${Y(v)+4}">${v}</text>`;
  (o.cuts||[]).filter(c=>c.v>lo&&c.v<hi).forEach(c=>g+=`<line class="cut" x1="${L}" x2="${W-R}" y1="${Y(c.v)}" y2="${Y(c.v)}"/><text class="cutl" x="${W-R+11}" y="${Y(c.v)+3}">${c.l}</text>`);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const best=Math.max(...vs),every=pts.length>9?Math.ceil(pts.length/8):1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fab" stop-opacity=".32"/><stop offset="1" stop-color="#ff8fab" stop-opacity="0"/></linearGradient></defs>${g}
    ${pts.length>1?`<path class="ar" style="fill:url(#${id})" d="${line} L${X(pts.length-1)} ${Y(lo)} L${X(0)} ${Y(lo)}Z"/>`:''}<path class="ln" d="${line}"/>
    ${pts.map((p,i)=>`<circle class="pt ${p.v===best&&pts.length>1?'best':''}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="5"/>${i%every===0||i===pts.length-1?`<text class="vl" x="${X(i).toFixed(1)}" y="${(Y(p.v)-10).toFixed(1)}">${p.v}</text><text class="xl" x="${X(i).toFixed(1)}" y="${H-10}">${p.label}</text>`:''}`).join('')}</svg>`;
}
function dayChart(t){
  const days=Array.from({length:14},(_,i)=>addDays(t,-13+i)),vals=days.map(minsOn),sum=vals.reduce((a,b)=>a+b,0);
  const W=340,H=160,L=2,R=2,T=20,B=22,bw=(W-L-R)/14,mx=Math.max(120,...vals);
  const bars=vals.map((v,i)=>{const h=Math.max(v?3:2,(H-T-B)*v/mx),x=L+i*bw+3,y=H-B-h,k=days[i],dn=kToDate(k).getDate();
    return `<rect class="bar1 ${k===t?'today':''} ${v?'':'zero'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${h.toFixed(1)}" rx="4"/>
      ${v?`<text class="vl" style="font-size:10px" x="${(x+(bw-6)/2).toFixed(1)}" y="${(y-4).toFixed(1)}">${v>=60?(Math.round(v/6)/10)+'h':v+'m'}</text>`:''}
      <text class="xl" style="${k===t?'fill:var(--pink-d)':''}" x="${(x+(bw-6)/2).toFixed(1)}" y="${H-7}">${dn}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${bars}</svg><p class="chartnote">14일 합계 <b>${fmtMin(sum)}</b> · 하루 평균 <b>${fmtMin(Math.round(sum/14))}</b></p>`;
}

function shopTile(k,it){

function buyItem(kind,it,free){
  const cost=free?0:it.cost,list={acc:S.bought,frame:S.frameBought,room:S.roomBought,item:S.rmBought}[kind];
  closeModal();

  S.churu-=cost;list.push(it.id);
  if(kind==='acc')S.wear=wearWith(it.id);else if(kind==='frame'){S.frame=it.id;applyFrame()}
  else if(kind==='room'){S.room=it.id;applyRoom()}else S.rm[it.slot]=it.id;
  afterDeco();decoCat.hop();decoCat.hearts(6);
  decoCat.say(fmt(kind==='room'?'우와, {cat이} 방이 예뻐졌어!':kind==='item'?'{me} 고마워! 방이 더 좋아졌어':kind==='frame'?'{cat이} 액자도 예뻐졌어!':'{me} 고마워! 바로 달게'),3000);

/* 한 번만: 츄르 규칙이 바뀌기 전에 오래 공부한 몫을 채워준다 */
function churuBackpay(){
  if(S.churuFix)return false;S.churuFix=1;
  let extra=0,long=0;
  S.sessions.forEach(x=>{if(x.c!=null)return;
    if(x.h==='quiz'){x.c=1;return}
    const o=churuOld(x.m),n=churuFor(x.m);x.c=Math.max(o,n);if(n>o){extra+=n-o;long+=x.m}});
  if(extra<=0){save();return false}
  S.churu+=extra;save();renderAll();
  openModal(`${miniCat()}<p class="rewardnum">츄르 +${extra}</p><p class="line">오래 공부한 만큼 츄르를 더 받도록 바꿨어요.<br>지금까지 길게 공부한 ${fmtMin(long)}만큼 채워 드려요!</p>
    <p class="note">이제 25분마다 츄르가 1개씩 더 생겨요.<br>1시간 3개 · 2시간 5개 · 3시간 8개</p><br><button class="btn" id="bp-ok">고마워요</button>`);
  $('#bp-ok').onclick=()=>{closeModal();setTimeout(runOnce,400)};
  return true;
}
function runOnce(){   // 앱을 열었을 때 1회성 알림을 하나씩 (모달이 겹치지 않게)

  if(!standalone){
    pc.innerHTML=`<h3>매일 알림 받기</h3><p class="note" style="margin-top:0">알림은 <b>홈 화면에 추가한 앱</b>에서만 켤 수 있어요.</p>
     <ol class="steps"><li>Safari 아래쪽 <b>공유 버튼</b>(네모에 화살표) 누르기</li><li><b>홈 화면에 추가</b> 누르기</li><li>홈 화면에 생긴 <b>냥공부</b>로 들어오기</li><li>여기서 다시 <b>알림 켜기</b></li></ol>`;return}
  if(!('PushManager' in window)||!('serviceWorker' in navigator)){pc.innerHTML=`<h3>매일 알림</h3><p class="note">이 기기는 알림을 지원하지 않아요. iOS 16.4 이상으로 업데이트하면 돼요.</p>`;return}
  if(S.push){
    pc.innerHTML=`<h3>매일 알림 켜짐</h3><p class="note" style="margin-top:0">매일 저녁 8시쯤 ${fmt('{cat이}')} 말을 걸어요.<br>처음 한 번만, 아래 버튼으로 <b>알림 코드</b>를 선생님께 보내 주세요.</p>
     <button class="btn butter" id="p-send" style="color:var(--ink)">알림 코드 보내기</button>
     <button class="link" id="p-re">알림 다시 연결하기</button>`;
    $('#p-send').onclick=sharePush;$('#p-re').onclick=()=>{S.push=null;save();enablePush()};
  }else{
    pc.innerHTML=`<h3>매일 알림 받기</h3><p class="note" style="margin-top:0">저녁마다 ${fmt('{cat이}')} 살짝 말을 걸어요.</p><button class="btn" id="p-on">알림 켜기</button>`;
    $('#p-on').onclick=enablePush;
  }
}
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('알림이 꺼져 있어요. 설정 > 냥공부 > 알림에서 켤 수 있어요');return}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    S.push=sub.toJSON();save();renderSet();
    reg.showNotification(S.cat||'모찌',{body:fmt('알림 연결 완료! 이제 저녁마다 {cat이} 찾아올게'),icon:'icons/icon-192.png',tag:'hello'});
  }catch(e){toast('알림 연결 실패: '+e.message)}
}
async function sharePush(){
  const code='NYANG:'+btoa(unescape(encodeURIComponent(JSON.stringify(S.push))));
  const text='냥공부 알림 코드예요\n'+code;
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('복사했어요! 카톡으로 보내주세요')}catch(e){prompt('이 코드를 복사해서 보내주세요',text)}
}
['s-me','s-cat'].forEach(id=>$('#'+id).addEventListener('change',e=>{S[id==='s-me'?'me':'cat']=e.target.value.trim();save();renderAll();toast('바꿨어요!')}));
$('#s-dday').addEventListener('change',e=>{if(e.target.value){S.dday=e.target.value;save();renderAll()}});
$('#b-export').onclick=async()=>{const {run,push,...rest}=S;const code='NYANGBAK:'+btoa(unescape(encodeURIComponent(JSON.stringify(rest))));
  try{await navigator.clipboard.writeText(code);toast('백업 코드 복사 완료! 메모장이나 카톡에 저장해 두세요')}catch(e){prompt('이 코드를 저장해 두세요',code)}};
$('#b-import').onclick=()=>{openSheet(`<h3>백업 불러오기</h3><p class="hint">저장해 둔 백업 코드를 붙여넣어 주세요.</p><textarea class="inp" id="imp"></textarea><br><br><button class="btn" id="imp-ok">불러오기</button>`);
  $('#imp-ok').onclick=()=>{try{const t=$('#imp').value.trim().replace(/^NYANGBAK:/,'');const d=JSON.parse(decodeURIComponent(escape(atob(t))));
    if(d.v!==1)throw 0;S={...load(),...d,push:S.push,run:null};save();closeSheet();applyFur();applyRoom();renderAll();toast('불러왔어요! 반가워')}catch(e){toast('코드가 올바르지 않아요')}}};

/* ---------- 서비스워커에 상태 전달 (알림 문구를 기기에서 고르기 위해) ---------- */
function syncSW(){
  if(!('caches' in window))return;
  const recent=studyDays().slice(-14);
  const state={me:S.me||'친구',cat:S.cat||'모찌',days:recent,rests:S.rests.slice(-7),dday:S.dday,total:studyDays().length};
  caches.open('nyang-state').then(c=>c.put('state.json',new Response(JSON.stringify(state),{headers:{'content-type':'application/json'}}))).catch(()=>{});
}

/* ---------- 기기 동기화: 폰·컴퓨터 어디서 열어도 같은 기록 ----------
   서버 = Apps Script "냥공부 동기화"(server/sync.gs). 연결 코드(ny-…)는 공개 코드에 없고 기기마다 localStorage에만 있다.
   가장 최근에 바뀐 쪽(S.upd)이 이긴다. 처음 연결하는 기기는 서버 기록을 그대로 받는다. */
const SYNC_URL=(location.hostname==='localhost'&&localStorage.getItem('nyang.syncurl'))||'https://script.google.com/macros/s/AKfycbyzhOC1n5O7tD5XPX-97mPAdbo_2y9yJtU9cnivy0snvgdfr_9ExohgHeO0cyYK7cjkmg/exec';
const SYNCK='nyang.k',APP_URL='https://reversecompany.github.io/nyang-study/';
let syncK=null;try{syncK=localStorage.getItem(SYNCK)}catch(e){}
let syncT=null,lastSync=0;
async function packS(){const {run,push,...rest}=S;const j=JSON.stringify(rest);
  if(window.CompressionStream){try{const u=new Uint8Array(await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return 'G1:'+btoa(b)}catch(e){}}
  return 'J1:'+btoa(unescape(encodeURIComponent(j)))}
async function unpackS(d){
  if(d.startsWith('G1:')){const u=Uint8Array.from(atob(d.slice(3)),c=>c.charCodeAt(0));
    return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
  return JSON.parse(decodeURIComponent(escape(atob(d.slice(3)))))}
function syncSoon(){if(!syncK||!SYNC_URL)return;clearTimeout(syncT);syncT=setTimeout(syncPush,2500)}
async function syncPush(force=false){
  if(!syncK||!SYNC_URL)return false;clearTimeout(syncT);syncT=null;
  try{const body=JSON.stringify({k:syncK,upd:S.upd||0,data:await packS(),force,me:S.me||''});
    const r=await(await fetch(SYNC_URL,{method:'POST',body,keepalive:body.length<60000})).json();
    if(r.ok){lastSync=Date.now();renderSyncCard();return true}
    if(r.stale)await syncPull();}catch(e){}
  return false}
async function syncPull(adopt=false){   // adopt: 이 기기를 처음 연결할 때 — 서버 기록을 그대로 받는다
  if(!syncK||!SYNC_URL)return 'off';
  try{const r=await(await fetch(SYNC_URL+'?action=load&k='+encodeURIComponent(syncK),{cache:'no-store'})).json();
    if(!r.data){await syncPush(true);return 'pushed'}
    if(adopt||r.upd>(S.upd||0)){const d=await unpackS(r.data);if(d.v!==1)return 'bad';
      clearTimeout(syncT);syncT=null;
      S={...defaultsS(),...d,push:S.push,run:S.run,upd:r.upd};
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} syncSW();
      applyFur();applyRoom();applyFrame();if(S.me)$('#onb').classList.remove('on');
      [homeCat,focusCat,decoCat].forEach(c=>c&&c.setMood(c.mood));renderAll();lastSync=Date.now();return 'pulled'}
    if(r.upd<(S.upd||0))await syncPush();
    lastSync=Date.now();renderSyncCard();return 'same'}catch(e){return 'err'}}
function syncLink(){return APP_URL+'#k='+syncK}
/* iPad 홈 화면 앱은 열 때 주소 뒤(#k=)를 버리는 경우가 있다. 쿠키는 iOS 17+ 에서 '홈 화면에 추가'하는 순간 앱으로 복사되므로 코드를 쿠키에도 둔다. */
function ckSet(k){try{document.cookie='nyang_k='+k+';max-age=31536000;path=/;SameSite=Lax'+(location.protocol==='https:'?';Secure':'')}catch(e){}}
function ckGet(){try{return (document.cookie.match(/(?:^|; )nyang_k=(ny-[a-z0-9]{12})/)||[])[1]}catch(e){}}
addEventListener('hashchange',()=>{const m=location.hash.match(/k=(ny-[a-z0-9]{12})/);if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);if(m[1]!==syncK)linkDevice(m[1])});
async function linkDevice(k){
  syncK=k;try{localStorage.setItem(SYNCK,k);if(S.sessions.length)localStorage.setItem(KEY+'.bak',JSON.stringify(S))}catch(e){}
  ckSet(k);
  const res=await syncPull(true);
  if(res==='pulled')toast(fmt('연결됐어요! 이제 여기서도 {cat랑} 같은 기록이에요'));
  else if(res==='err'){toast('인터넷 연결을 확인하고 다시 열어 주세요')}
  renderSyncCard();return res}
/* 연결 코드는 학생이 만들 필요 없이 앱이 알아서 만든다. 선생님은 관리자 조회로 링크를 꺼내 보내 준다(server/links.py). */
async function autoLink(){
  if(syncK||!SYNC_URL||!S.me)return false;
  const k='ny-'+[...crypto.getRandomValues(new Uint8Array(12))].map(b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');
  syncK=k;if(!S.upd)S.upd=Date.now();
  if(!await syncPush(true)){syncK=null;return false}
  try{localStorage.setItem(SYNCK,k)}catch(e){}
  ckSet(k);renderSyncCard();return true;
}
function linkSheet(){
  openSheet(`<h3>다른 기기에서 열기</h3><p class="hint">컴퓨터나 다른 폰에서 이 링크를 열면 끝이에요.<br>카톡 '나와의 채팅'으로 보내 두면 편해요.</p>
    <input class="inp" readonly value="${syncLink()}" style="font-size:14px" onclick="this.select()"><br><br>
    <button class="btn" id="lk-share">링크 보내기</button><button class="link" id="lk-copy" style="display:block;margin:10px auto 0">링크만 복사</button>
    <p class="note" style="margin-top:12px">이 링크는 ${fmt('{me}')}만의 열쇠예요. 다른 사람한테는 보내지 마세요.</p>`);
  $('#lk-copy').onclick=async()=>{try{await navigator.clipboard.writeText(syncLink());toast('링크만 복사했어요')}catch(e){prompt('이 링크를 복사해 주세요',syncLink())}};
  $('#lk-share').onclick=async()=>{
    try{if(navigator.share){await navigator.share({title:'냥공부',url:syncLink()});return}}catch(e){if(e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(syncLink());toast('링크 복사 완료!')}catch(e){prompt('이 링크를 복사해 주세요',syncLink())}};
}
function codeSheet(){
  openSheet(`<h3>링크로 연결하기</h3><p class="hint">다른 기기에서 받은 링크(또는 ny-로 시작하는 코드)를 붙여넣어 주세요.<br>이 기기 기록 대신 연결된 기록을 불러와요.</p>
    <input class="inp" id="lk-in" placeholder="https://…#k=ny-…" style="font-size:15px"><br><br><button class="btn" id="lk-ok">연결하기</button>`);
  $('#lk-ok').onclick=async()=>{const m=$('#lk-in').value.match(/ny-[a-z0-9]{12}/);if(!m){toast('링크가 올바르지 않아요');return}
    closeSheet();await linkDevice(m[0])};
}
function renderSyncCard(){
  const c=$('#syncCard');if(!c)return;
  if(!SYNC_URL){c.style.display='none';return}
  c.style.display='block';
  if(!syncK){
    c.innerHTML=`<h3>컴퓨터에서도 하기</h3><p class="note" style="margin-top:0">인터넷이 연결되면 알아서 준비돼요.</p>
      <button class="link" id="sy-code" style="margin-top:4px">링크를 받았어요</button>`;
    $('#sy-code').onclick=codeSheet;return}
  const ago=lastSync?Math.round((Date.now()-lastSync)/60000):null;
  c.innerHTML=`<h3>기기 연결됨</h3><p class="note" style="margin-top:0">어디서 공부해도 같은 기록으로 이어져요.${ago===null?'':ago<1?' 방금 동기화했어요.':` ${ago}분 전에 동기화했어요.`}</p>
    <button class="btn sub ghost" id="sy-send">다른 기기에 링크 보내기</button><button class="btn sub ghost" id="sy-code" style="margin-top:8px">다른 기기 기록 불러오기 (링크를 받았어요)</button><button class="link" id="sy-now">지금 동기화</button>`;
  $('#sy-send').onclick=linkSheet;$('#sy-code').onclick=codeSheet;
  $('#sy-now').onclick=async()=>{const r=await syncPull();toast(r==='err'?'인터넷 연결을 확인해 주세요':r==='pulled'?'다른 기기 기록을 불러왔어요':'최신 상태예요')};
}

/* ---------- 탭 ---------- */
function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.v===v));window.scrollTo(0,0);renderAll();fitDesk()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));
function renderAll(){renderRooms();renderHome();renderSyncCard();if($('#v-sm').classList.contains('on'))SM.render();if($('#v-rec').classList.contains('on'))renderRec();if($('#v-deco').classList.contains('on'))renderDeco();if($('#v-set').classList.contains('on'))renderSet()}

$('#b-start').onclick=()=>subjectSheet(durationSheet);
$('#b-five').onclick=()=>subjectSheet(s=>{closeSheet();startFocus(s,5)});
$('#b-log').onclick=logSheet;
$('#b-rest').onclick=restDay;
$('#b-breath').onclick=breathStart;
$('#br-x').onclick=breathEnd;
$('#f-pause').onclick=togglePause;
$('#f-end').onclick=endFocus;
$('#qz-x').onclick=()=>SM.quit();

/* ---------- 컴퓨터 화면 크기 맞춤 ----------
   창이 900px 이상이면 왼쪽 메뉴 + 2열 화면. 배율(zoom)은 '홈이 한 화면에 다 들어오는' 크기로 창 크기에 맞춰 정한다.
   브라우저를 확대·축소해도(⌘+ / ⌘−) 창 크기가 바뀐 것과 같아서 자동으로 다시 맞춘다. */
const mqDesk=matchMedia('(min-width:900px)');
let deskNeed=0,fitT=0;
function fitDesk(){
  const h=document.documentElement;
  if(!mqDesk.matches){h.style.zoom='';h.style.setProperty('--zm','1');return}
  const hv=$('#v-home'),acts=document.querySelector('#v-home .acts');
  if(hv&&acts&&hv.classList.contains('on')){h.style.zoom='1';h.style.setProperty('--zm','1');deskNeed=acts.getBoundingClientRect().bottom+window.scrollY+20}
  const zz=Math.max(.72,Math.min(1.6,innerWidth/1120,innerHeight/(deskNeed||700)));
  h.style.zoom=zz.toFixed(3);h.style.setProperty('--zm',zz.toFixed(3));
}
addEventListener('resize',()=>{clearTimeout(fitT);fitT=setTimeout(fitDesk,60)});
if(mqDesk.addEventListener)mqDesk.addEventListener('change',fitDesk);

/* ---------- 시작 ---------- */
function boot(){
  fixWear();applyFur();applyRoom();applyFrame();
  homeCat=new Walker($('#homeStage'));homeCat.onTap=homeTap;
  focusCat=new Walker($('#focusStage'),{speed:.8});focusCat.onTap=c=>{c.face('pet',1400);c.hearts(4);c.say(say('focus'),3000)};
  decoCat=new Walker($('#decoStage'),{wander:false});decoCat.x=0;decoCat.onTap=c=>{c.face('pet',1400);c.hearts(5);c.say(say('pet'),2500)};
  decoCat.el.style.left='50%';decoCat.el.style.marginLeft='-80px';decoCat.el.style.transform='none';decoCat.place=()=>{};decoCat.bub.style.left='50%';
  renderAll();fitDesk();
  if(S.run) showFocus();
  setInterval(chatter,16000);setTimeout(chatter,1600);
  if(!S.me){
    $('#onb').classList.add('on');
    onbCat=new Walker($('#onbStage'));onbCat.setMood('happy');onbCat.onTap=c=>{c.face('pet',1400);c.hearts(5);c.say('반가워!',2000)};
    $('#o-go').onclick=()=>{const me=$('#o-me').value.trim();if(!me){toast('너를 부를 이름을 알려줘');return}
      S.me=me;S.cat=$('#o-cat').value.trim()||'모찌';save();$('#onb').classList.remove('on');renderAll();autoLink();
      homeCat.hop();homeCat.say(fmt('반가워 {me}! 나는 {cat이야}. 오늘부터 잘 부탁해'),6000)};
  }
  const q=new URLSearchParams(location.search);
  if(q.get('from')==='push'&&S.me&&!S.run){setTimeout(()=>{if(mood()!=='happy')homeCat.say(say(mood()==='sleep'?'wake':'normal'),5000)},900)}
  syncSW();
  // 동기화를 먼저 끝내고(최대 4초) 나서 1회성 알림(환불·앨범)을 띄운다 — 오래된 기기 기록이 새 기록을 덮지 않게
  const hk=(location.hash.match(/k=(ny-[a-z0-9]{12})/)||[])[1]||(syncK?null:ckGet());   // 주소·저장이 비었으면 쿠키에서 되찾는다
  if(location.hash.match(/k=ny-/))history.replaceState(null,'',location.pathname+location.search);
  if(syncK)ckSet(syncK);
  const first=hk&&hk!==syncK?linkDevice(hk):syncPull();
  Promise.race([first,new Promise(r=>setTimeout(r,4000))]).then(()=>{
    autoLink();
    setTimeout(runOnce,700)});
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
boot();
</script>
