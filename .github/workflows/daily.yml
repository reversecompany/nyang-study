name: daily-nyang
on:
  schedule:
    - cron: '0 11 * * *'   # 매일 11:00 UTC = 20:00 KST (GitHub 사정으로 몇~수십 분 늦을 수 있음)
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save web-push@3
      - run: node push/send.mjs
        env:
          SUBSCRIPTIONS: ${{ secrets.SUBSCRIPTIONS }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      # 60일간 저장소 활동이 없으면 GitHub가 예약 실행을 끈다 → 매번 다시 켜 둔다
      - if: always()
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/daily.yml/enable || true
        env:
          GH_TOKEN: ${{ github.token }}
